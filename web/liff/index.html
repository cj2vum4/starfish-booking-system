<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海星劇本殺｜預約與揪團</title>
<style>
  :root { --bg:#f6f4f0; --fg:#1f1d1a; --muted:#6b665f; --card:#fff; --line:#e4dfd8; --accent:#06c755;
    --accent-fg:#fff; --soft:#eef8f1; --warn:#b3261e; --chip:#f1eee9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141311; --fg:#f1eee9; --muted:#a7a199; --card:#1f1d1a;
    --line:#35322d; --soft:#16301f; --warn:#f2b8b5; --chip:#2a2723; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; margin:4px 0 16px; }
  header h1 { margin:0; font-size:18px; }
  header small { color:var(--muted); }
  h2 { font-size:17px; margin:0 0 12px; }
  h3 { font-size:15px; margin:20px 0 8px; color:var(--muted); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:14px; }
  .error { color:var(--warn); font-size:14px; margin-top:8px; }
  button, .btn { display:block; width:100%; padding:13px; border:0; border-radius:10px; font:inherit; font-weight:600;
    background:var(--accent); color:var(--accent-fg); cursor:pointer; text-align:center; text-decoration:none; }
  button.secondary { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--warn); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .stack > * + * { margin-top:10px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .chips.wrap { flex-wrap:wrap; overflow:visible; }
  .chip { flex:0 0 auto; width:auto; padding:8px 12px; border-radius:999px; background:var(--chip); color:var(--fg);
    border:1px solid transparent; font-weight:500; font-size:14px; }
  .chip[aria-pressed="true"] { background:var(--soft); border-color:var(--accent); color:var(--fg); }
  .day { min-width:64px; text-align:center; line-height:1.3; }
  .day b { display:block; font-size:18px; }
  .times { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .times .chip { width:100%; border-radius:10px; padding:10px; }
  .stepper { display:flex; align-items:center; gap:12px; }
  .stepper button { width:44px; padding:8px; }
  .month-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .month-nav button { width:auto; padding:8px 12px; }
  .stepper output { min-width:56px; text-align:center; font-size:20px; font-weight:700; }
  select, textarea, input[type=text], input[type=number] { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); font:inherit; }
  textarea { min-height:72px; resize:vertical; }
  .seats { list-style:none; padding:0; margin:0; }
  .seats li { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
  .seats li:first-child { border-top:0; }
  .seats li > span:last-child { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .seats .chip { padding:4px 10px; font-size:13px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .tag.ok { background:var(--soft); color:var(--fg); }
  .group-row { display:block; width:100%; text-align:left; background:var(--card); color:var(--fg); border:1px solid var(--line);
    font-weight:400; }
  .big { font-size:20px; font-weight:700; }
  .friend-bar { border-color:var(--accent); background:var(--soft); }
  .game-card { display:flex; gap:12px; align-items:flex-start; text-align:left; background:var(--card); color:var(--fg);
    border:1px solid var(--line); font-weight:400; padding:10px; }
  .game-card[aria-pressed="true"] { border-color:var(--accent); background:var(--soft); }
  .game-card b { display:block; font-size:16px; }
  .poster { width:56px; height:78px; flex:0 0 56px; border-radius:8px; object-fit:cover; background:var(--chip); }
  .poster.none { display:grid; place-items:center; color:var(--muted); font-size:13px; }
  .link { display:inline-block; margin-top:4px; color:var(--accent); font-size:14px; text-decoration:underline; }
  .ledger { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .ledger:first-child { border-top:0; }
  .ledger.void > div:first-child, .ledger.void b { text-decoration:line-through; color:var(--muted); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label.check { display:flex; align-items:center; gap:8px; }
  .gate { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .gate .card { width:100%; max-width:560px; margin:0; border-radius:18px 18px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header><h1>海星劇本殺</h1><small id="who"></small></header>
  <div id="friendBar" class="card stack friend-bar" hidden>
    <div><b>加入「海星劇本殺」好友，才收得到通知</b></div>
    <div class="muted">成團、滿團、取消等消息都會用 LINE 傳給你。沒加好友的話，LINE 不允許我們傳訊息。</div>
    <button id="addFriend">加入好友</button>
  </div>
  <div id="friendGate" class="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="card stack">
      <div class="big" id="gateTitle">先加入「海星劇本殺」好友</div>
      <div class="muted">開團、加入或認領位子前，要先加好友。成團、滿團、取消的通知都會用 LINE 傳給你，沒加好友 LINE 不讓我們傳。</div>
      <div class="muted">加完好友回到這裡，會自動繼續剛才的動作。</div>
      <button id="gateAdd">加入好友</button>
      <button class="secondary" id="gateDone">我加好了，繼續</button>
      <div id="gateHint" class="error" hidden>還沒偵測到你加好友，請先按「加入好友」。</div>
      <button class="secondary" id="gateClose">先不要</button>
    </div>
  </div>
  <div id="view" aria-live="polite"><div class="card">載入中…</div></div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script src="config.js"></script>
<script>
  // Session token lives only in this tab; LINE tokens are sent once to the server and never stored.
  const { LIFF_ID, API_BASE } = window.STARFISH_CONFIG;
  const KEY = 'starfish.session';
  const ERRORS = {
    IDENTITY_MERGE_REQUIRED: '你的新舊玩本名字需要由店家合併，請聯絡海星。',
    SLOT_UNAVAILABLE: '這個時段剛被預約，或店家剛好有事，請改選其他時間。',
    TOO_FAR_AHEAD: '最遠只能預約 6 個月內的時段。',
    NAME_EXISTS: '這個名字已經有玩本記錄了。如果是你，請按「我是老玩家」綁定（店家確認）；不是的話請換一個名字。',
    BINDING_PENDING: '你的老玩家綁定還在審核中，請先用申請的名字填寫。',
    CALENDAR_UNAVAILABLE: '暫時無法確認店家行事曆，請稍後再試。',
    GROUP_FULL: '這團已經滿了。', SOLD_OUT: '這團已經滿了。',
    GROUP_CLOSED: '這團已停止招募。', INVITE_USED: '這個位子已經被別人認領了。',
    INVITE_INVALID: '邀請連結已失效，請向主揪索取新的連結。', ALREADY_MEMBER: '你已經在這團裡了。',
    GROUP_NOT_FOUND: '找不到這個揪團，或你沒有查看權限。', ORGANIZER_CANNOT_LEAVE: '主揪不能退出，請改用「解散揪團」。',
    INVALID_CAPACITY: '人數不符合這個劇本的人數限制。', INVALID_NAME: '請輸入 1–100 字的名字。',
    CATALOG_UNAVAILABLE: '暫時讀不到 GitHub 上的劇本資料。', CATALOG_UNREADABLE: 'GitHub 上的 scripts.js 格式無法辨識。',
    INVALID_CATALOG: '劇本資料有欄位不正確，已整批取消同步。',
    INVALID_PRICE: '請輸入每人價格（整數元）。', PRICE_REQUIRED: '請輸入每人價格。', INVALID_VENUE: '請輸入場地。',
    INVALID_DM: '請輸入 DM 名字。', NOT_ADMIN: '只有店家可以操作。', GAME_NOT_FOUND: '請選擇劇本。',
    INVALID_SURVEY: '問卷內容不完整。', TOO_MANY_REQUESTS: '短時間內送出太多次，請稍後再試。',
    SURVEY_NOT_FOUND: '找不到這份回覆，可能已經刪除。', IMPORT_TOO_LARGE: '試算表太大（超過 5000 列），請聯絡維護者分批匯入。',
    GOOGLE_NOT_CONFIGURED: '還沒設定 Google 服務帳戶。',
    SHEET_NOT_SHARED: '試算表沒有共用給下面這個服務帳戶（權限選「檢視者」即可）。',
    SHEETS_API_DISABLED: '下面這個 Google Cloud 專案還沒啟用 Google Sheets API。', INVALID_BODY_SIZE: '內容太長了。',
    SHEET_NOT_FOUND: '找不到這份試算表。',
    SHEETS_FAILED: '暫時讀不到 Google 試算表，請稍後再試。', INVALID_RANGE: '查詢的日期範圍不正確。', GOOGLE_KEY_INVALID: 'Google 服務帳戶金鑰無效。',
    CALENDAR_WRITE_FAILED: '已成團，但寫入 Google 日曆失敗，請按「重新寫入 Google 日曆」。',
    CALENDAR_WRITE_NOT_CONFIGURED: '已成團；尚未設定店家日曆，所以沒有寫入 Google 日曆。',
    CALENDAR_REMOVE_FAILED: '場次已取消，但 Google 日曆上的行程沒刪成功，請按「重試刪除」。',
    NOT_FRIEND: '要先加入「海星劇本殺」好友，才能開團或加入。',
    EVENT_COMPLETED: '這場已經結束，不能取消。',
    NAME_TAKEN: '這個名字已經被別的 LINE 帳號綁定了。如果那是你，請直接在聊天室告訴店家。',
    ALREADY_BOUND: '你已經綁定過了。', BINDING_DECIDED: '這筆申請已經處理過了。', BINDING_NOT_FOUND: '找不到這筆綁定申請。',
    NAME_NOT_FOUND: '玩本記錄裡找不到這個名字，請從清單中選擇。', INVALID_NOTE: '備註最多 200 字。',
    RECORDS_UNAVAILABLE: '暫時讀不到海星網站的玩本記錄，請稍後再試。',
    BONUS_SECRET_MISMATCH: '已核准，但回歸禮沒發成功：Apps Script 的 BOOKING_SECRET 與 Supabase 的 PLAY_RECORD_SECRET 不一致。',
    BONUS_NOT_CONFIGURED: '已核准，但還沒設定 PLAY_RECORD_SECRET，回歸禮沒有發。',
    BONUS_FAILED: '已核准，但回歸禮暫時沒發成功，請稍後按「重試發回歸禮」。', INVALID_REASON: '原因沒有填，或超過字數。',
    RECORDS_NOT_LIVE: '玩本記錄還沒切換到預約系統。', RECORDS_LIVE: '已經切換到預約系統，不能再整批匯入；請改用「補匯入新記錄」。',
    RECORDS_WENT_LIVE: '曾經切換到預約系統，不能再整批匯入（會刪掉切換後的記錄）；切回預約系統後用「補匯入新記錄」。',
    RECONCILE_STALE: '讀不到 Apps Script 最新的點數總覽，不能確認一致，請稍後再按一次切換。',
    IMPORT_REQUIRED: '請先匯入玩本記錄。', RECONCILE_MISMATCH: '對帳還有差異。請先處理，或確認差異沒問題後按「仍要切換」。',
    INVALID_IMPORT: '試算表的內容無法辨識，請聯絡維護者。', INVALID_RECORD: '記錄內容不完整。', REVIEW_NOT_FOUND: '找不到這則心得。',
    LEDGER_APPEND_ONLY: '點數帳本只能新增，不能修改或刪除。', INVALID_SOURCE: '切換的目標不正確。', INVALID_POINTS: '點數不正確（1–1000 的整數）。',
    NOT_ENOUGH_POINTS: '點數不夠（申請中的兌換會先保留點數）。', REDEMPTION_DECIDED: '這筆兌換已經處理過了。',
    REDEMPTION_NOT_FOUND: '找不到這筆兌換申請。', BINDING_REQUIRED: '要先綁定玩本記錄的名字才能兌換。',
    REWARD_NOT_FOUND: '找不到這個獎勵，可能已經下架。', INVALID_TITLE: '請輸入 1–20 字的稱號。',
    LEDGER_VOIDED: '這筆點數已經作廢了。', LEDGER_NOT_FOUND: '找不到這筆點數。',
    RECORD_HIDDEN: '這筆記錄已經隱藏了。', RECORD_NOT_HIDDEN: '這筆記錄沒有隱藏。', RECORD_NOT_FOUND: '找不到這筆記錄（隱藏的記錄不能精選）。',
    NO_COMMENT: '這筆記錄沒有寫心得，不能精選。', ALIAS_TAKEN: '這個別名已經屬於另一位玩家。', ALIAS_NOT_FOUND: '找不到這個別名。',
    NAME_IS_PLAYER: '這個名字本身就是一位玩家，同一人請改用「合併」。',
    ALIAS_HAS_LINE: '有 LINE 帳號正在用這個名字，不能當別名（會讓那個帳號拿到這位玩家的點數）。是同一人的話，請玩家用「我是老玩家」綁定。', SAME_PLAYER: '不能合併到自己。',
    INVALID_SETTING: '設定值不正確：點數類是 0–1000 的整數，日期要像 2026/10/13。', INVALID_REWARD: '獎勵要有名稱，點數 1–10000。',
    INVALID_QUEST: '任務目標要 0–100、點數 0–1000。',
    ADMIN_OA_NOT_CONFIGURED: '還沒設定管理員 OA 的 Channel access token（Supabase Secrets 的 LINE_ADMIN_CHANNEL_ACCESS_TOKEN）。',
  };
  const view = document.getElementById('view');
  const store = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} } };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const message = code => ERRORS[code] || '發生錯誤，請稍後再試。';
  const tz = { timeZone: 'Asia/Taipei' };
  const dayKey = iso => new Intl.DateTimeFormat('en-CA', { ...tz, year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(iso));
  const fmtDay = iso => new Intl.DateTimeFormat('zh-TW', { ...tz, month:'numeric', day:'numeric', weekday:'short' }).format(new Date(iso));
  const fmtTime = iso => new Intl.DateTimeFormat('zh-TW', { ...tz, hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).format(new Date(iso));
  const fmtRange = (a, b) => `${fmtDay(a)} ${fmtTime(a)}${b ? '–' + fmtTime(b) : ''}`;
  let me = null;
  let pendingGame = null;  // scripts.js id to preselect when the create page opens

  // An expired session signs in again once and retries; 'reauth' means LINE login is redirecting.
  async function api(path, { method = 'GET', body, retried = false } = {}) {
    const token = store.get(KEY);
    const res = await fetch(API_BASE + path, { method,
      headers: { ...(body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && !retried) {
      store.set(KEY, null);
      if (await signIn()) return api(path, { method, body, retried: true });
      throw new Error('reauth');
    }
    if (!res.ok) { const e = new Error(data.error || 'ERROR'); e.code = data.error; throw e; }
    return data;
  }

  // returnTo: where LINE login sends the player back. On the first sign-in it is the address the page was
  // opened with, because start() has already moved ?view=/?game= into the hash and they would be lost.
  async function signIn(returnTo = location.href) {
    const idToken = liff.getIDToken();
    if (!idToken) { liff.login({ redirectUri: returnTo }); return false; }
    const res = await fetch(API_BASE + '/auth/line', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken }) });
    if (res.status === 401) { liff.logout(); liff.login({ redirectUri: returnTo }); return false; } // stale ID token
    if (!res.ok) throw new Error('LOGIN_FAILED');
    const data = await res.json();
    store.set(KEY, data.sessionToken);
    me = data.user;
    return true;
  }

  const render = html => { view.innerHTML = html; window.scrollTo(0, 0); };
  const go = hash => { location.hash = hash; };
  const busy = (btn, on) => { if (btn) { btn.disabled = on; btn.dataset.label ??= btn.textContent; btn.textContent = on ? '處理中…' : btn.dataset.label; } };

  // ---- Home -------------------------------------------------------------------------
  async function showHome() {
    render(`<div class="card stack"><div class="big">你好，${esc(me.displayName || 'LINE 玩家')}</div>
      <p class="muted">劇本預約：選人數、挑劇本、約時間，再把邀請連結分享給朋友。</p>
      <button id="new">我要開團</button><button class="secondary" id="openList">看缺人場次</button>
      <button class="secondary" id="historyBtn">我的遊戲紀錄</button>
      <button class="secondary" id="guideBtn">新手指南</button></div>
      <h3>我的揪團</h3><div id="mine" class="muted">讀取中…</div>
      ${me.isAdmin ? `<h3>店家管理</h3><div class="card stack"><div class="muted">劇本資料來源：GitHub starfishlarp／scripts.js</div>
        <button id="adminBtn">店家後台：場次總覽</button>
        <button class="secondary" id="bindingsBtn">老玩家綁定審核</button>
        <button class="secondary" id="surveysBtn">角色問卷回覆</button>
        <button class="secondary" id="sync">從 GitHub 同步劇本</button><div id="syncMsg" class="muted"></div></div>
        <h3>店家：玩本記錄與點數</h3><div class="card stack">
        <button id="redemptionsBtn">兌換審核</button>
        <button class="secondary" id="playersBtn">玩家點數（補點、扣點、別名、合併）</button>
        <button class="secondary" id="reviewsBtn">心得管理（精選、隱藏）</button>
        <button class="secondary" id="ruleBtn">點數規則・獎勵・任務</button>
        <button class="secondary" id="reportBtn">玩本月報</button>
        <button class="secondary" id="recordsBtn">玩本記錄與點數（搬家）</button></div>
        <h3>店家：近期揪團</h3><div id="adminGroups" class="muted">讀取中…</div>` : ''}`);
    document.getElementById('new').onclick = () => go('#/create');
    document.getElementById('openList').onclick = () => go('#/open');
    document.getElementById('historyBtn').onclick = () => go('#/history');
    document.getElementById('guideBtn').onclick = () => go('#/guide');
    if (me.isAdmin) api('/admin/groups').then(({ groups }) => {
      const box = document.getElementById('adminGroups');
      box.innerHTML = groups.length ? groups.map(g => `
        <button class="card group-row" data-admin-group="${esc(g.groupId)}"><div><b>${esc(fmtRange(g.startsAt, g.endsAt))}</b>
        <span class="tag ${g.status === 'confirmed' ? 'ok' : ''}">${{ confirmed: '已成團', cancelled: '已取消' }[g.status] || '待確認'}</span></div>
        <div class="muted">${esc(g.organizerName)}・${esc(g.gameTitle || '請店家推薦')}・${g.filled}/${g.capacity} 人</div></button>`).join('')
        : '<div class="card muted">目前沒有揪團。</div>';
      box.querySelectorAll('[data-admin-group]').forEach(b => b.onclick = () => go('#/group/' + b.dataset.adminGroup));
    }).catch(e => { if (e.message !== 'reauth') document.getElementById('adminGroups').textContent = message(e.code); });
    document.getElementById('adminBtn')?.addEventListener('click', () => go('#/admin'));
    document.getElementById('bindingsBtn')?.addEventListener('click', () => go('#/bindings'));
    document.getElementById('surveysBtn')?.addEventListener('click', () => go('#/surveys'));
    document.getElementById('recordsBtn')?.addEventListener('click', () => go('#/records'));
    for (const [btn, to] of [['redemptionsBtn', '#/redemptions'], ['playersBtn', '#/players'], ['reviewsBtn', '#/reviews'],

  // ---- 老玩家綁定: claim the 歸戶名 used on the website's 玩本記錄; the store approves ----
  const BONUS_ZH = { granted: '已發回歸禮', already: '回歸禮之前已發過', ineligible: '不符合回歸禮資格', none: '回歸禮尚未入帳' };
  async function showVeteran() {
    render(`<h2>我是老玩家</h2><div class="card">讀取中…</div>`);
    let binding, names, bound;
    try { [{ binding }, { names, bound }] = await Promise.all([api('/me/binding'), api('/records/names')]); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>我是老玩家</h2><div class="card error">${esc(message(e.code))}</div>${homeBtn}`); return; }
    if (binding?.status === 'approved') {
      render(`<h2>我是老玩家</h2><div class="card stack"><b>已綁定「${esc(binding.recordName)}」</b>
        <div class="muted">你的 LINE 已和玩本記錄連在一起，點數與兌換請看會員卡。</div></div>
        <div class="stack"><button id="vCard">打開會員卡</button>${homeBtn}</div>`);
      document.getElementById('vCard').onclick = () => go('#/card');
      return;
    }
    const taken = new Set(bound);
    let chosen = binding?.status === 'pending' ? binding.recordName : '';
    render(`<h2>我是老玩家</h2>
      ${binding?.status === 'pending' ? `<div class="card stack"><b>審核中：「${esc(binding.recordName)}」</b>
        <div class="muted">店家確認後會用 LINE 通知你。選錯名字的話，可以在下面改選再送出。</div></div>` : ''}
      ${binding?.status === 'rejected' ? `<div class="card error">店家沒有通過「${esc(binding.recordName)}」的綁定，可以改選名字重新申請。</div>` : ''}
      <div class="card stack"><b>以前填玩本記錄用的名字</b>
        <div class="muted">綁定後，點數、紀錄都會跟著這個 LINE 帳號；老玩家綁定完成還有 50 點回歸禮。每個名字只能綁定一個 LINE。</div>
        <input id="q" type="text" placeholder="輸入你用過的名字" autocomplete="off">
        <div id="matches" class="stack"></div>
        <textarea id="note" maxlength="200" placeholder="以前還用過其他名字的話，寫在這裡（選填）">${esc(binding?.status === 'pending' ? binding.note : '')}</textarea>
        <button id="vSubmit" disabled>送出綁定申請</button><div id="err" class="error" hidden></div></div>
      ${homeBtn}`);
    const $ = id => document.getElementById(id);
    function paint() {
      const q = $('q').value.trim().toLowerCase();
      const list = q ? names.filter(n => n.name.toLowerCase().includes(q)).slice(0, 20) : names.filter(n => n.name === chosen);
      $('matches').innerHTML = list.length ? list.map(n => `<button class="game-card" data-name="${esc(n.name)}"
          aria-pressed="${n.name === chosen}" ${taken.has(n.name) ? 'disabled' : ''}>
          <div><b>${esc(n.name)}</b> <span class="muted">${esc(n.agent)}</span>
          <div class="muted">玩過 ${n.plays} 場${n.last ? '・最後一次 ' + esc(n.last) : ''}${taken.has(n.name) ? '・已被綁定' : ''}</div></div></button>`).join('')
        : `<div class="muted">${q ? '找不到這個名字，換個寫法試試（例如去掉表情符號）。' : '輸入名字後，從清單點選你的那一個。'}</div>`;
      document.querySelectorAll('[data-name]').forEach(b => b.onclick = () => { chosen = b.dataset.name; paint(); });
      $('vSubmit').disabled = !chosen;
      $('vSubmit').textContent = chosen ? `綁定「${chosen}」` : '送出綁定申請';
    }
    $('q').oninput = paint;
    paint();
    $('vSubmit').onclick = async e => {
      busy(e.target, true); $('err').hidden = true;
      try { await api('/me/binding', { method: 'POST', body: { name: chosen, note: $('note').value } }); showVeteran(); }
      catch (x) { if (x.message === 'reauth') return; busy(e.target, false); $('err').textContent = message(x.code); $('err').hidden = false; }
    };
  }

          ${r.status === 'pending' ? `<button class="secondary" data-cancel="${esc(r.id)}">取消申請</button>` : ''}</div>`).join('')}` : ''}`
        : '<div class="card muted">要兌換時，到店把這個畫面給店家看，店家會幫你扣點。</div>'}
      ${tracks.map(t => `<h3>${esc(t)}</h3>${list.filter(r => r.track === t).map(r => `<div class="card stack">
        <div><b>${esc(r.name)}</b> <span class="tag ${avail >= r.cost ? 'ok' : ''}">${r.cost} 點${avail >= r.cost ? '・可兌換' : ''}</span></div>
        ${r.note ? `<div class="muted">${esc(r.note)}</div>` : ''}
        ${live && avail >= r.cost ? `${/稱號/.test(r.name) ? `<input type="text" maxlength="20" placeholder="想要的稱號（1–20 字）" data-title-for="${esc(r.id)}">` : ''}
          <button data-redeem="${esc(r.id)}">申請兌換</button>` : ''}</div>`).join('')}`).join('')}
      <div class="stack"><button class="secondary" data-site="榮譽牆.html">看榮譽牆</button>
        <button class="secondary" id="cHistory">我的遊戲紀錄</button>${homeBtn}</div>`);
    document.getElementById('cHistory').onclick = () => go('#/history');
    bindSiteLinks();
    const keys = {};  // one request ID per reward until it goes through: a retry after a lost reply is not a second request
    document.querySelectorAll('[data-redeem]').forEach(btn => btn.onclick = async () => {
      const rw = list.find(r => r.id === btn.dataset.redeem);
      const title = document.querySelector(`[data-title-for="${rw.id}"]`)?.value.trim() ?? '';
      if (/稱號/.test(rw.name) && !title) return flash('redeemMsg', '請先填想要的稱號。', true);
      if (!confirm(`申請兌換「${rw.name}」（${rw.cost} 點）？店家核准後才會扣點。`)) return;
      busy(btn, true);
      try {
        await api('/me/redemptions', { method: 'POST', body: { rewardId: rw.id, title, requestId: keys[rw.id] ??= crypto.randomUUID() } });
        await showCard();
        flash('redeemMsg', `已送出「${rw.name}」的兌換申請，店家核准後會用 LINE 通知你。`);
      } catch (x) {
        if (x.message === 'reauth') return;
        busy(btn, false);
        flash('redeemMsg', x.code === 'TOO_MANY_REQUESTS' ? '申請中的兌換最多 5 筆，請等店家處理後再申請。' : message(x.code), true);
      }
    });
    document.querySelectorAll('[data-cancel]').forEach(btn => btn.onclick = async () => {
      if (!confirm('取消這筆兌換申請？保留的點數會放回。')) return;
      busy(btn, true);
      try { await api(`/me/redemptions/${btn.dataset.cancel}/cancel`, { method: 'POST' }); await showCard(); flash('redeemMsg', '已取消申請。'); }
      catch (x) { if (x.message !== 'reauth') { busy(btn, false); flash('redeemMsg', message(x.code), true); } }
    });
  }

  const REDEEM_ZH = { pending: '申請中', approved: '已兌換', rejected: '未通過', cancelled: '已取消', refunded: '已退點' };
  // A message box at the top of the page (after a re-render, which scrolls to the top).

      ${done.length ? `<h3>最近 30 天已處理</h3>${done.map(row).join('')}` : ''}${homeBtn}`);

  const surveyField = (r, re) => (r.fields.find(f => re.test(f.label)) || {}).value || '';
  async function showSurveys() {

          右邊自己加的「分配角色」「備註」也會帶進來；已匯入或已刪除的不會重複出現。

  // cursor = the last answer already shown ({submittedAt, id}); older answers are added below the shown ones.
  async function showSurveyScript(script, cursor = null, shown = []) {
    if (!cursor) render(`<h2>${esc(script)}</h2><div class="card">讀取中…</div>`);
    let responses;
    try { ({ responses } = await api(`/admin/role-surveys/responses?script=${encodeURIComponent(script)}${cursor
      ? `&before=${encodeURIComponent(cursor.submittedAt)}&beforeId=${encodeURIComponent(cursor.id)}` : ''}`)); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>${esc(script)}</h2><div class="card error">${esc(message(e.code))}</div>${homeBtn}`); return; }
    const all = [...shown, ...responses];
    const card = r => `<div class="card stack" id="r-${esc(r.id)}">
        <div><b>${esc(surveyField(r, SURVEY_NAME) || '（沒填名字）')}</b>
          ${r.assignedRole ? `<span class="tag ok">${esc(r.assignedRole)}</span>` : '<span class="tag">未分配</span>'}</div>
        <div class="muted">${[surveyField(r, SURVEY_GENDER), surveyField(r, SURVEY_DATE) && '遊玩 ' + surveyField(r, SURVEY_DATE),
          '填寫 ' + fmtRange(r.submittedAt) + (r.source === 'sheet' ? '（舊試算表）' : '')].filter(Boolean).map(esc).join('・')}</div>
        <details><summary class="link">看全部回答</summary>
          ${r.fields.map(f => `<div style="margin-top:8px"><div class="muted">${esc(f.label)}</div><div style="white-space:pre-wrap">${esc(f.value)}</div></div>`).join('')}
        </details>
        <input type="text" maxlength="100" placeholder="分配的角色" value="${esc(r.assignedRole)}" data-role="${esc(r.id)}">
        <textarea maxlength="1000" placeholder="備註（只有店家看得到）" data-note="${esc(r.id)}">${esc(r.storeNote)}</textarea>
        <div class="chips"><button data-save="${esc(r.id)}">儲存</button><button class="secondary" data-del="${esc(r.id)}">刪除這份</button></div>
        <div class="muted" data-saved="${esc(r.id)}"></div></div>`;
    render(`<h2>${esc(script)}</h2>
      <p class="muted">新的在前。填好分配的角色按「儲存」；回覆是垃圾或玩家要求刪除個資時按「刪除這份」。</p>
      ${all.length ? all.map(card).join('') : '<div class="card muted">這本還沒有回覆。</div>'}
      ${responses.length === 30 ? '<button class="secondary" id="more">看更早的回覆</button>' : ''}
      <div class="stack"><button class="secondary" id="back">回問卷列表</button>${homeBtn}</div>`);
    document.getElementById('back').onclick = () => go('#/surveys');
    const next = responses.length ? { submittedAt: responses.at(-1).submittedAt, id: responses.at(-1).id } : cursor;
    document.getElementById('more')?.addEventListener('click', () => {
      // Keep what the store typed but has not saved yet.
      all.forEach(r => {
        const role = document.querySelector(`[data-role="${r.id}"]`), note = document.querySelector(`[data-note="${r.id}"]`);
        if (role) r.assignedRole = role.value;
        if (note) r.storeNote = note.value;
      });
      showSurveyScript(script, next, all);
    });
    document.querySelectorAll('[data-save]').forEach(btn => btn.onclick = async () => {
      const id = btn.dataset.save, saved = document.querySelector(`[data-saved="${id}"]`);
      busy(btn, true);
      try {
        const r = await api(`/admin/role-surveys/responses/${id}`, { method: 'POST', body: {
          assignedRole: document.querySelector(`[data-role="${id}"]`).value, storeNote: document.querySelector(`[data-note="${id}"]`).value } });
        const i = all.findIndex(x => x.id === id); if (i >= 0) all[i] = r;
        saved.textContent = '已儲存。';
      } catch (x) { if (x.message !== 'reauth') saved.textContent = message(x.code); }
      busy(btn, false);
    });
    document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
      if (!confirm('確定刪除這份回覆？刪除後無法復原，之後重新匯入也不會再出現。\n如果是玩家要求刪除個資，舊的 Google 試算表「角色問卷總表」裡那一列也請一併刪除。')) return;
      busy(btn, true);
      try {
        await api(`/admin/role-surveys/responses/${btn.dataset.del}/delete`, { method: 'POST' });
        const i = all.findIndex(x => x.id === btn.dataset.del); if (i >= 0) all.splice(i, 1);
        document.getElementById('r-' + btn.dataset.del)?.remove();
      } catch (x) { if (x.message !== 'reauth') { busy(btn, false); alert(message(x.code)); } }
    });
  }
