  // ---- Create a group ---------------------------------------------------------------
  // The website's 7 core tags (starfishlarp scripts-data.js FILTER_TYPES, same order). Every script carries at
  // least one, spelled exactly like this, so a filter is a plain match.
  const TAG_FILTERS = ['情感', '推理', '陣營', '歡樂', '微恐', '新手', '繁體'];
  const hours = m => `${+(m / 60).toFixed(1)} 小時`;
  const stars = d => d == null || d === '' ? '' : '・難度 ' + '★'.repeat(Math.max(0, Math.min(5, +d))) + '☆'.repeat(5 - Math.max(0, Math.min(5, +d)));

  async function showCreate() {
    render(`<h2>我要開團</h2><div class="card">讀取劇本中…</div>`);
    let games = [], played = new Set();
    try { const r = await api('/games'); games = r.games; played = new Set(r.playedGameIds || []); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>我要開團</h2><div class="card error">${esc(message(e.code))}</div>
      <button class="secondary" onclick="history.back()">返回</button>`); return; }

    const state = { capacity: 6, tag: '', gameId: '', day: null, start: null, visibility: 'private', month: 0 };
    const wanted = games.find(g => g.slug === pendingGame);
    pendingGame = null;
    if (wanted) {
      state.gameId = wanted.gameId;
      state.capacity = Math.min(Math.max(state.capacity, wanted.minPlayers), wanted.maxPlayers);
    }
    const slotCache = {};  // "minutes|YYYY-MM" -> slots (or {error})
    // 店家決定最遠可預約 6 個月（伺服器也檢查）；時間一次看一個月。
    const months = (() => {
      const last = dayKey(new Date(Date.now() + 183 * 86400000).toISOString()).slice(0, 7);
      const list = [dayKey(new Date().toISOString()).slice(0, 7)];
      while (list[list.length - 1] < last) {
        const [y, mo] = list[list.length - 1].split('-').map(Number);
        list.push(mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, '0')}`);
      }
      return list;
    })();
    const slotKey = () => `${minutes()}|${months[state.month]}`;
    // One request ID per form keeps double taps and retries from opening two groups.
    const requestId = store.get('starfish.createRequest') || crypto.randomUUID();
    store.set('starfish.createRequest', requestId);

    render(`<h2>我要開團</h2>
      <div class="card"><h3 style="margin-top:0">1. 幾個人玩？</h3>
        <div class="stepper"><button class="secondary" id="minus" aria-label="減少">−</button>
        <output id="cap">6</output><button class="secondary" id="plus" aria-label="增加">＋</button></div></div>
      <div class="card"><h3 style="margin-top:0">2. 選劇本</h3>
        <div class="chips" id="tags"></div><p class="muted" id="gameCount"></p><div id="games" class="stack"></div></div>
      <div class="card" id="whenCard"><h3 style="margin-top:0">3. 選時間</h3><div id="when"></div></div>
      <div class="card" id="venueCard"><h3 style="margin-top:0">4. 在哪裡玩？</h3>${venuePicker('南港')}</div>
      <div class="card"><h3 style="margin-top:0">5. 備註</h3>
        <textarea id="note" maxlength="2000" placeholder="例如：有人第一次玩、想要不恐怖的"></textarea>
        <h3>誰可以加入</h3><div class="chips">
          <button class="chip" aria-pressed="true" data-vis="private">只有收到連結的人</button>
          <button class="chip" aria-pressed="false" data-vis="public">公開招募</button></div></div>
      <div class="stack"><div id="summary" class="muted"></div><button id="submit" disabled>確認開團</button>
        <div id="err" class="error" hidden></div><button class="secondary" onclick="history.back()">返回</button></div>`);

    const $ = id => document.getElementById(id);
    const chosenVenue = bindVenuePicker($('venueCard'));
    const game = () => games.find(g => g.gameId === state.gameId);
    const minutes = () => game()?.durationMinutes || 240;
    const tagMatch = g => !state.tag || (g.genres || []).includes(state.tag);
    const fits = g => g.minPlayers <= state.capacity && state.capacity <= g.maxPlayers;

    function paintGames() {
      $('cap').textContent = state.capacity;
      $('minus').disabled = state.capacity <= 2; $('plus').disabled = state.capacity >= 12;
      $('tags').innerHTML = [['', '全部'], ...TAG_FILTERS.map(t => [t, t])].map(([v, label]) =>
        `<button class="chip" aria-pressed="${state.tag === v}" data-tag="${esc(v)}">${esc(label)}</button>`).join('');
      // Scripts the organizer has already played go to the end of the list.
      const list = games.filter(g => fits(g) && tagMatch(g))
        .sort((a, b) => Number(played.has(a.gameId)) - Number(played.has(b.gameId)));
      if (state.gameId && !list.some(g => g.gameId === state.gameId)) { state.gameId = ''; state.day = state.start = null; }
      $('gameCount').textContent = `${state.capacity} 人可玩${state.tag ? '・' + state.tag : ''}：${list.length} 本`;
      $('games').innerHTML = `<button class="game-card" aria-pressed="${!state.gameId}" data-game="">
          <div class="poster none">?</div><div><b>請店家推薦</b><div class="muted">依人數${state.tag ? '與「' + esc(state.tag) + '」' : ''}幫你挑，先保留 4 小時</div></div></button>`
        + list.map(g => `<button class="game-card" aria-pressed="${g.gameId === state.gameId}" data-game="${esc(g.gameId)}">
          ${g.imageUrl ? `<img class="poster" loading="lazy" alt="" src="${esc(g.imageUrl)}">` : '<div class="poster none">海星</div>'}
          <div><b>${esc(g.title)}</b>${played.has(g.gameId) ? ' <span class="tag">你玩過</span>' : ''}<div class="muted">${esc(g.playersLabel || g.minPlayers + ' 人')}・${hours(g.durationMinutes)}${esc(stars(g.difficulty))}</div>
          <div class="muted">${esc((g.genres || []).slice(0, 4).join('、'))}</div>
          ${g.sourceUrl ? `<span class="link" data-intro="${esc(g.sourceUrl)}">看劇本介紹</span>` : ''}</div></button>`).join('');
      document.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { state.tag = b.dataset.tag; paintGames(); });
      document.querySelectorAll('[data-game]').forEach(b => b.onclick = e => {
        if (e.target.dataset.intro) { liff.openWindow({ url: e.target.dataset.intro, external: true }); return; }
        if (state.gameId !== b.dataset.game) { state.gameId = b.dataset.game; state.day = state.start = null; }
        paintGames();
      });
      paintWhen();
    }

    async function paintWhen() {
      const m = minutes(), key = slotKey(), month = months[state.month];
      const [y, mo] = month.split('-').map(Number);
      const nav = `<div class="month-nav">
        <button class="secondary" id="prevMonth" ${state.month === 0 ? 'disabled' : ''}>‹ 上個月</button>
        <b>${y} 年 ${mo} 月</b>
        <button class="secondary" id="nextMonth" ${state.month === months.length - 1 ? 'disabled' : ''}>下個月 ›</button></div>`;
      const bindNav = () => {
        $('prevMonth').onclick = () => { state.month--; state.day = state.start = null; paintWhen(); };
        $('nextMonth').onclick = () => { state.month++; state.day = state.start = null; paintWhen(); };
      };
      if (!slotCache[key]) {
        $('when').innerHTML = nav + '<p class="muted">正在確認店家可預約的時間…</p>'; bindNav();
        const days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
        try { slotCache[key] = (await api(`/slots?from=${month}-01&days=${days}&minutes=${m}`)).slots; }
        catch (e) { if (e.message === 'reauth') return; slotCache[key] = { error: e.code }; }
        if (key !== slotKey()) return;  // the player picked another script or month meanwhile
      }
      const slots = slotCache[key];
      if (slots.error) { $('when').innerHTML = nav + `<p class="error">${esc(message(slots.error))}</p>`; bindNav(); paintSummary(); return; }
      if (!slots.length) { $('when').innerHTML = nav + `<p class="muted">這個月沒有可容納 ${esc(hours(m))} 的時段，看看下個月、換劇本或洽店家。</p>`; bindNav(); paintSummary(); return; }
      const days = [...new Set(slots.map(s => dayKey(s.startsAt)))];
      if (!days.includes(state.day)) { state.day = days[0]; state.start = null; }
      $('when').innerHTML = nav + `<p class="muted">每場 ${esc(hours(m))}</p><div class="chips" id="days">${days.map(d => {
          const first = slots.find(s => dayKey(s.startsAt) === d);
          return `<button class="chip day" aria-pressed="${d === state.day}" data-day="${d}">${esc(fmtDay(first.startsAt))}</button>`; }).join('')}</div>
        <div class="times" style="margin-top:10px">${slots.filter(s => dayKey(s.startsAt) === state.day).map(s =>
          `<button class="chip" aria-pressed="${s.startsAt === state.start}" data-start="${esc(s.startsAt)}">${esc(fmtTime(s.startsAt))}–${esc(fmtTime(s.endsAt))}</button>`).join('')}</div>`;
      document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { state.day = b.dataset.day; state.start = null; paintWhen(); });
      document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => { state.start = b.dataset.start; paintWhen(); });
      bindNav();
      paintSummary();
    }

    function paintSummary() {
      const slots = slotCache[slotKey()];
      const slot = Array.isArray(slots) && slots.find(s => s.startsAt === state.start);
      $('summary').textContent = slot ? `${fmtRange(slot.startsAt, slot.endsAt)}・${state.capacity} 人・${game()?.title || '請店家推薦'}` : '請選擇開始時間';
      $('submit').disabled = !slot;
    }

    $('minus').onclick = () => { state.capacity--; paintGames(); };
    $('plus').onclick = () => { state.capacity++; paintGames(); };
    document.querySelectorAll('[data-vis]').forEach(b => b.onclick = () => { state.visibility = b.dataset.vis;
      document.querySelectorAll('[data-vis]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    gated($('submit'), async () => {
      busy($('submit'), true); $('err').hidden = true;
      try {
        const group = await api('/groups', { method: 'POST', body: { requestId, startsAt: state.start, capacity: state.capacity,
          gameId: state.gameId || null, preferences: !state.gameId && state.tag ? [state.tag] : [], note: $('note').value,
          visibility: state.visibility, venue: chosenVenue() } });
        store.set('starfish.createRequest', null);
        go('#/group/' + group.groupId);
      } catch (e) {
        if (e.message === 'reauth') return;
        busy($('submit'), false);
        if (e.code === 'NOT_FRIEND') return showFriendGate(() => $('submit').click());
        $('err').textContent = message(e.code); $('err').hidden = false;
        if (e.code === 'SLOT_UNAVAILABLE') { store.set('starfish.createRequest', null); delete slotCache[slotKey()]; state.start = null; paintWhen(); }
      }
    });
    paintGames();
    if (wanted) $('whenCard').scrollIntoView({ block: 'start' });
  }

  // ---- Group page -------------------------------------------------------------------
  // 場地：開團時主揪選，店家確認成團時沿用。分享訊息裡的地址與導航連結。
  const VENUE_INFO = {
    '南港': { label: '南港', address: '南港車站附近', maps: [['', 'https://maps.app.goo.gl/T25k6E3NWEWTWQbd9?g_st=ac']] },
    '北車': { label: '台北車站', address: '台北車站附近', maps: [['', 'https://maps.app.goo.gl/jJ18RYbXC3ySM32B7']] },
    '新竹交大': { label: '新竹交大', address: '新竹交大工五 117', maps: [
      ['活動地點導航', 'https://maps.app.goo.gl/qJYEYwD2nj6c8Sb98?g_st=ac'],
      ['機車停車導航', 'https://maps.app.goo.gl/Sr9ixti8pptGL5xZ6?g_st=ac'],
      ['汽車停車導航', 'https://goo.gl/maps/dmc6UTfGwkmwS1Na7?g_st=ac']] },
  };
  const venueLabel = v => VENUE_INFO[v]?.label || v;
  function venuePicker(current) {
    const known = Object.keys(VENUE_INFO), other = !!current && !known.includes(current);
    return `<div class="chips">${known.map(v =>
        `<button class="chip" aria-pressed="${v === current}" data-venue="${esc(v)}">${esc(VENUE_INFO[v].label)}</button>`).join('')}
        <button class="chip" aria-pressed="${other}" data-venue="">自選地點</button></div>
      <input type="text" data-venue-other maxlength="60" placeholder="輸入地點名稱或地址" value="${other ? esc(current) : ''}" ${other ? '' : 'hidden'}>`;
  }
  // Wires a venuePicker inside root; returns a getter for the chosen venue ('' when 自選 is empty).
  function bindVenuePicker(root) {
    const other = root.querySelector('[data-venue-other]');
    let chosen = root.querySelector('[data-venue][aria-pressed="true"]')?.dataset.venue ?? '南港';
    root.querySelectorAll('[data-venue]').forEach(b => b.onclick = () => {
      chosen = b.dataset.venue;
      root.querySelectorAll('[data-venue]').forEach(x => x.setAttribute('aria-pressed', x === b));
      other.hidden = chosen !== ''; if (!other.hidden) other.focus();
    });
    return () => chosen || other.value.trim();
  }
  function inviteText(g, url) {
    const venue = g.event?.venue || g.venue || '南港', info = VENUE_INFO[venue];
    const parts = new Intl.DateTimeFormat('en-CA', { ...tz, month: '2-digit', day: '2-digit' }).formatToParts(new Date(g.startsAt));
    const part = t => parts.find(p => p.type === t).value;
    const cents = g.event?.priceCents ?? g.gamePriceCents ?? DEFAULT_PRICE * 100;
    const lines = [`日期：${part('month')}/${part('day')}`, `時間：${fmtTime(g.startsAt)}`,
      `劇本：${g.gameTitle || '店家推薦' + (g.preferences?.length ? '（' + g.preferences.join('、') + '）' : '')}`,
      `價格：${Math.round(cents / 100)}$`, `人數：${g.gamePlayersLabel || g.capacity + '人'}`,
      `地址：${info ? info.address : venue}`];
    if (info) info.maps.forEach(([label, link]) => { if (label) lines.push(label); lines.push(link); });
    const readable = u => { try { return decodeURI(u); } catch { return u; } };
    if (g.gameSourceUrl) lines.push('劇本介紹', readable(g.gameSourceUrl));
    if (g.gameVideoUrl) lines.push('劇本影片介紹', g.gameVideoUrl);
    lines.push('群組連結', url);
    return lines.join('\n');
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const box = document.createElement('textarea');
    box.value = text; box.setAttribute('readonly', ''); box.style.position = 'fixed'; box.style.opacity = '0';
    document.body.appendChild(box); box.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    box.remove();
    return ok;
  }

  async function share(text, url) {
    const full = url ? `${text}\n${url}` : text;
    if (liff.isApiAvailable('shareTargetPicker')) {
      try { await liff.shareTargetPicker([{ type: 'text', text: full }]); return; } catch {}
    }
    location.href = 'https://line.me/R/share?text=' + encodeURIComponent(full);
  }
  const inviteUrl = token => `https://liff.line.me/${LIFF_ID}?invite=${encodeURIComponent(token)}`;

  async function showGroup(id) {
    let g;
    try { g = await api('/groups/' + id); }
    catch (e) { if (e.message !== 'reauth') render(`<div class="card error">${esc(message(e.code))}</div>
      <button class="secondary" onclick="location.hash='#/'">回首頁</button>`); return; }
    const open = g.capacity - g.filled;
    const statusText = g.event?.status === 'completed' ? '已結束' : g.status === 'cancelled' && g.event ? '場次已取消'
      : { recruiting: '招募中', pending_confirmation: '等待店家確認', confirmed: '已成團', cancelled: '已解散' }[g.status] || g.status;
    render(`<div class="card stack"><div class="big">${esc(fmtRange(g.startsAt, g.endsAt))}</div>
        <div class="muted">${esc(g.gameTitle || '劇本待店家推薦')}${g.preferences?.length ? '・' + esc(g.preferences.join('、')) : ''}</div>
        <div class="muted">地點：${esc(venueLabel(g.event?.venue || g.venue || '南港'))}</div>
        <div><span class="tag ok">${esc(statusText)}</span> <span class="tag">${g.filled}/${g.capacity} 人${open > 0 && g.status === 'recruiting' ? `・還缺 ${open} 人` : ''}</span>
        ${g.status === 'recruiting' ? `<span class="tag">${g.visibility === 'public' ? '公開招募' : '憑連結加入'}</span>` : ''}</div>
        ${g.note ? `<div class="muted">備註：${esc(g.note)}</div>` : ''}
        ${g.event?.status === 'cancelled' ? `<div class="error">店家已取消這場${g.event.cancelReason ? '：' + esc(g.event.cancelReason) : '。'}</div>` : ''}
        ${g.event && g.event.status !== 'cancelled' ? `<div class="muted">場地：${esc(g.event.venue)}・DM：${esc(g.event.dmName)}・每人 NT$${Math.round(g.event.priceCents / 100)}</div>` : ''}</div>
      <div id="store"></div>
      <div class="card"><h3 style="margin-top:0">座位</h3>${g.seats ? '' : '<p class="muted">加入後可以看到其他成員。</p>'}<ul class="seats">${(g.seats || []).map(s => `<li>
        <span>${s.seatNumber}. ${s.status === 'open' ? '<span class="muted">空位</span>' : esc(s.name)}${s.isMe ? '（我）' : ''}</span>
        <span>${s.status === 'reserved' ? '<span class="tag">保留中・待認領</span>' : s.status === 'joined' ? '<span class="tag ok">已加入</span>' : ''}
        ${(g.isOrganizer && s.status === 'reserved') || (s.isMe && !g.isOrganizer) ? `<button class="chip" data-leave="${esc(s.seatId)}">${s.isMe ? '退出' : '取消保留'}</button>` : ''}</span></li>`).join('')}</ul></div>
      <div class="stack" id="actions"></div><div id="err" class="error" hidden></div>`);
    const actions = document.getElementById('actions');
    if (me.isAdmin) renderStorePanel(g, id);
    const err = text => { const el = document.getElementById('err'); el.textContent = text; el.hidden = false; };
    // Anyone may join a public recruiting group straight from its page (e.g. from 缺人場次).
    if (!g.isOrganizer && !g.isMember && g.visibility === 'public' && g.status === 'recruiting' && open > 0) {
      actions.innerHTML = '<button id="joinPublic">加入這團</button>';
      const joinBtn = document.getElementById('joinPublic');
      gated(joinBtn, async () => {
        busy(joinBtn, true);
        try { await api(`/groups/${id}/join`, { method: 'POST' }); showGroup(id); }
        catch (x) { if (x.message === 'reauth') return; busy(joinBtn, false);
          if (x.code === 'NOT_FRIEND') return showFriendGate(() => joinBtn.click()); err(message(x.code)); }
      });
    }
    if (g.isOrganizer && g.status === 'recruiting') {
      const toPublic = g.visibility !== 'public';
      actions.innerHTML = `${open > 0 ? '<button id="invite">分享到 LINE</button><button class="secondary" id="copyInvite">複製邀請訊息</button><button class="secondary" id="reserve">幫朋友保留位子</button>' : ''}
        <button class="secondary" id="venueEdit">更改場地</button>
        <div class="card stack" id="venueBox" hidden>${venuePicker(g.venue || '南港')}<button id="venueSave">儲存場地</button></div>
        <button class="secondary" id="visibility">${toPublic ? '改為公開招募（出現在缺人場次）' : '改為只限收到連結的人'}</button>
        <button class="danger" id="cancel">解散揪團</button>`;
      document.getElementById('visibility').onclick = async e => {
        if (!confirm(toPublic ? '公開後，所有人都能在「缺人場次」看到這團並直接加入。確定嗎？'
          : '改回後，只有拿到邀請連結的人能加入，這團也會從「缺人場次」消失。確定嗎？')) return;
        busy(e.target, true);
        try { await api(`/groups/${id}/visibility`, { method: 'POST', body: { visibility: toPublic ? 'public' : 'private' } }); showGroup(id); }
        catch (x) { if (x.message !== 'reauth') { err(message(x.code)); busy(e.target, false); } }
      };
      document.getElementById('invite')?.addEventListener('click', async e => {
        busy(e.target, true);
        try { const { token } = await api(`/groups/${id}/share-link`, { method: 'POST' });
          await share(inviteText(g, inviteUrl(token))); }
        catch (x) { if (x.message !== 'reauth') err(message(x.code)); }
        busy(e.target, false);
      });
      document.getElementById('copyInvite')?.addEventListener('click', async e => {
        const btn = e.target;
        busy(btn, true);
        try { const { token } = await api(`/groups/${id}/share-link`, { method: 'POST' });
          const ok = await copyText(inviteText(g, inviteUrl(token)));
          busy(btn, false);
          btn.textContent = ok ? '已複製，貼到群組就好' : '複製失敗，請改用「分享到 LINE」';
          setTimeout(() => { btn.textContent = '複製邀請訊息'; }, 2500); }
        catch (x) { busy(btn, false); if (x.message !== 'reauth') err(message(x.code)); }
      });
      const venueBox = document.getElementById('venueBox'), chosenVenue = bindVenuePicker(venueBox);
      document.getElementById('venueEdit').onclick = () => { venueBox.hidden = !venueBox.hidden; };
      document.getElementById('venueSave').onclick = async e => {
        if (!chosenVenue()) return err(message('INVALID_VENUE'));
        busy(e.target, true);
        try { await api(`/groups/${id}/venue`, { method: 'POST', body: { venue: chosenVenue() } }); showGroup(id); }
        catch (x) { if (x.message !== 'reauth') { err(message(x.code)); busy(e.target, false); } }
      };
      document.getElementById('reserve')?.addEventListener('click', async e => {
        const name = prompt('幫誰保留位子？輸入朋友的名字（之後他用連結認領）');
        if (!name || !name.trim()) return;
        busy(e.target, true);
        try { const { token } = await api(`/groups/${id}/reserve`, { method: 'POST', body: { displayName: name.trim() } });
          await share(`${name.trim()}，我幫你在劇本殺揪團保留了位子！\n${fmtRange(g.startsAt, g.endsAt)}，點連結認領：`, inviteUrl(token));
          showGroup(id); }
        catch (x) { if (x.message !== 'reauth') err(message(x.code)); busy(e.target, false); }
      });
      document.getElementById('cancel').onclick = async e => {
        if (!confirm('確定要解散這團嗎？所有邀請連結都會失效，時段也會釋出。')) return;
        busy(e.target, true);
        try { await api(`/groups/${id}/cancel`, { method: 'POST' }); go('#/'); }
        catch (x) { if (x.message !== 'reauth') err(message(x.code)); busy(e.target, false); }
      };
    }
    actions.insertAdjacentHTML('beforeend', '<button class="secondary" id="home">回首頁</button>');
    document.getElementById('home').onclick = () => go('#/');
    document.querySelectorAll('[data-leave]').forEach(b => b.onclick = async () => {
      if (!confirm(b.textContent === '退出' ? '確定要退出這團嗎？' : '確定要取消這個保留位子嗎？')) return;
      try { await api(`/seats/${b.dataset.leave}/leave`, { method: 'POST' }); b.textContent === '退出' ? go('#/') : showGroup(id); }
      catch (x) { if (x.message !== 'reauth') err(message(x.code)); }
    });
  }

  // ---- Store panel: confirm a group, or retry writing it to Google Calendar ------------
  const DEFAULT_PRICE = 400, DEFAULT_DM = '海星', VENUES = ['南港', '北車', '新竹交大'];
  async function renderStorePanel(g, id) {
    const box = document.getElementById('store');
    if (g.status === 'cancelled' && g.event) {
      const pending = g.event.calendarSynced && !g.event.calendarRemoved;
      box.innerHTML = `<div class="card stack"><h3 style="margin-top:0">店家</h3>
        <div>${pending ? '⚠️ Google 日曆上的行程還沒刪除' : '✅ Google 日曆已同步（行程已移除）'}</div>
        ${pending ? '<button class="secondary" id="calRetry">重試刪除 Google 日曆行程</button>' : ''}<div id="calMsg" class="muted"></div></div>`;
      document.getElementById('calRetry')?.addEventListener('click', async e => {
        busy(e.target, true);
        try { const r = await api(`/admin/events/${g.event.eventId}/calendar`, { method: 'POST' });
          if (r.calendarRemoved) { showGroup(id); return; } document.getElementById('calMsg').textContent = message(r.calendarError); }
        catch (x) { if (x.message !== 'reauth') document.getElementById('calMsg').textContent = message(x.code); }
        busy(e.target, false);
      });
      return;
    }
    if (g.status === 'confirmed' && g.event?.status === 'completed') {
      box.innerHTML = '<div class="card stack"><h3 style="margin-top:0">店家</h3><div>✅ 場次已結束，出席已記錄。</div></div>';
      return;
    }
    // After the session starts: record who came; attendees get it in their play history.
    if (g.status === 'confirmed' && g.event && Date.parse(g.startsAt) <= Date.now()) {
      let participants = [];
      try { ({ participants } = await api(`/admin/events/${g.event.eventId}/participants`)); }
      catch (e) { if (e.message === 'reauth') return; }
      box.innerHTML = `<div class="card stack"><h3 style="margin-top:0">場次結束：記錄出席</h3>
        <div class="muted">取消勾選沒來的人。出席的人會記入遊戲紀錄。</div>
        ${participants.map(p => `<label style="display:block;padding:6px 0"><input type="checkbox" data-pid="${esc(p.participantId)}" checked> ${esc(p.name)}</label>`).join('')}
        <button id="evDone">記錄出席並結束場次</button><div id="calMsg" class="muted"></div></div>`;
      document.getElementById('evDone').onclick = async e => {
        const absent = [...document.querySelectorAll('[data-pid]')].filter(c => !c.checked).map(c => c.dataset.pid);
        if (!confirm(`出席 ${participants.length - absent.length} 人、缺席 ${absent.length} 人，確定嗎？`)) return;
        busy(e.target, true);
        try { await api(`/admin/events/${g.event.eventId}/complete`, { method: 'POST', body: { absent } }); showGroup(id); }
        catch (x) { if (x.message !== 'reauth') document.getElementById('calMsg').textContent = message(x.code); busy(e.target, false); }
      };
      return;
    }
    if (g.status === 'confirmed' && g.event) {
      box.innerHTML = `<div class="card stack"><h3 style="margin-top:0">店家</h3>
        <div>${g.event.calendarSynced ? '✅ 已寫入 Google 日曆' : '⚠️ 尚未寫入 Google 日曆'}</div>
        ${g.event.calendarSynced ? '' : '<button class="secondary" id="calRetry">重新寫入 Google 日曆</button>'}<div id="calMsg" class="muted"></div>
        <button class="danger" id="evCancel">取消這場</button></div>`;
      document.getElementById('evCancel').onclick = async e => {
        const reason = prompt('取消原因（成員會看到，可留空）', '');
        if (reason === null) return;
        if (!confirm('確定取消這場嗎？所有成員的報名會一併取消，時段會釋出，Google 日曆上的行程也會刪除。')) return;
        busy(e.target, true);
        try {
          const r = await api(`/admin/events/${g.event.eventId}/cancel`, { method: 'POST', body: { reason: reason.trim() || null } });
          const notes = [];
          if (r.refundRequired) notes.push('有成員已付款，請記得退款。');
          if (!r.calendarRemoved) notes.push(message(r.calendarError));
          if (notes.length) alert(notes.join(' '));
          showGroup(id);
        } catch (x) { if (x.message !== 'reauth') document.getElementById('calMsg').textContent = message(x.code); busy(e.target, false); }
      };
      document.getElementById('calRetry')?.addEventListener('click', async e => {
        busy(e.target, true);
        try { const r = await api(`/admin/events/${g.event.eventId}/calendar`, { method: 'POST' });
          if (r.calendarSynced) { showGroup(id); return; } document.getElementById('calMsg').textContent = message(r.calendarError); }
        catch (x) { if (x.message !== 'reauth') document.getElementById('calMsg').textContent = message(x.code); }
        busy(e.target, false);
      });
      return;
    }
    if (g.status !== 'recruiting') return;
    let games = [], playedBy = {};
    try { [{ games }, { played: playedBy }] = await Promise.all([api('/games'), api(`/groups/${id}/played`)]); }
    catch (e) { if (e.message === 'reauth') return; }
    // Unplayed scripts first; each option says how many members already played it.
    const fitting = games.filter(x => x.minPlayers <= g.capacity && g.capacity <= x.maxPlayers)
      .sort((a, b) => (playedBy[a.gameId]?.length ?? 0) - (playedBy[b.gameId]?.length ?? 0));
    const playedNote = x => playedBy[x.gameId]?.length ? `・團內 ${playedBy[x.gameId].length} 人玩過` : '';
    const gv = g.venue || '南港';
    box.innerHTML = `<div class="card stack"><h3 style="margin-top:0">店家確認成團</h3>
      ${g.filled < g.capacity ? `<div class="muted">目前 ${g.filled}/${g.capacity} 人。成團後邀請連結就不能再加入新成員。</div>` : ''}
      <label class="muted">劇本</label><select id="cGame"><option value="">請選擇</option>${fitting.map(x =>
        `<option value="${esc(x.gameId)}" ${x.gameId === g.gameId ? 'selected' : ''}>${esc(x.title)}（${esc(hours(x.durationMinutes))}${esc(playedNote(x))}）</option>`).join('')}</select>
      <label class="muted">每人價格（元）</label><input type="text" id="cPrice" inputmode="numeric" value="${DEFAULT_PRICE}">
      <label class="muted">場地（主揪選的：${esc(venueLabel(gv))}）</label><select id="cVenue">${VENUES.map(v => `<option ${v === gv ? 'selected' : ''}>${esc(v)}</option>`).join('')}<option value="" ${VENUES.includes(gv) ? '' : 'selected'}>自選場地</option></select>
      <input type="text" id="cVenueOther" maxlength="200" placeholder="輸入場地名稱或地址" value="${VENUES.includes(gv) ? '' : esc(gv)}" ${VENUES.includes(gv) ? 'hidden' : ''}>
      <label class="muted">DM</label><input type="text" id="cDm" value="${esc(DEFAULT_DM)}" maxlength="100">
      <div id="cHint" class="muted"></div>
      <button id="cGo">確認成團並寫入 Google 日曆</button><div id="cErr" class="error" hidden></div></div>`;
    const $ = x => document.getElementById(x);
    const hint = () => { const x = fitting.find(y => y.gameId === $('cGame').value);
      const held = (Date.parse(g.endsAt) - Date.parse(g.startsAt)) / 60000;
      $('cHint').textContent = !x ? '' : x.durationMinutes > held ? `這本 ${hours(x.durationMinutes)}，比保留的 ${hours(held)} 長，會檢查後面時間是否空著再延長。`
        : x.durationMinutes < held ? `這本 ${hours(x.durationMinutes)}，多保留的時間會釋出。` : ''; };
    $('cGame').onchange = hint; hint();
    $('cVenue').onchange = () => { $('cVenueOther').hidden = $('cVenue').value !== ''; if (!$('cVenueOther').hidden) $('cVenueOther').focus(); };
    const venue = () => $('cVenue').value || $('cVenueOther').value.trim();
    $('cGo').onclick = async e => {
      const err = t => { $('cErr').textContent = t; $('cErr').hidden = false; };
      const price = $('cPrice').value.trim();
      if (!$('cGame').value) return err(message('GAME_NOT_FOUND'));
      if (!/^\d{1,6}$/.test(price)) return err(message('INVALID_PRICE'));
      if (!venue()) return err(message('INVALID_VENUE'));
      busy(e.target, true); $('cErr').hidden = true;
      try {
        const r = await api(`/admin/groups/${id}/confirm`, { method: 'POST', body: { gameId: $('cGame').value,
          priceTwd: Number(price), venue: venue(), dmName: $('cDm').value } });
        if (!r.calendarSynced) alert(message(r.calendarError));
        showGroup(id);
      } catch (x) {
        if (x.message === 'reauth') return;
        busy(e.target, false);
        err(x.code === 'SLOT_UNAVAILABLE' ? '這本需要的時間撞到其他場次或你的 Google 日曆行程，請改選較短的劇本。' : message(x.code));
      }
    };
  }

  // ---- Invite landing ---------------------------------------------------------------
  async function showInvite(token) {
    let inv;
    try { inv = await api('/invites/preview', { method: 'POST', body: { token } }); }
    catch (e) { if (e.message !== 'reauth') render(`<div class="card error">${esc(message(e.code))}</div>
      <button class="secondary" onclick="location.hash='#/'">回首頁</button>`); return; }
    if (inv.claimedByMe) { go('#/group/' + inv.groupId); return; }
    const seat = inv.purpose === 'claim_group_seat';
    render(`<div class="card stack"><div class="muted">${esc(inv.organizerName)} 邀請你一起玩劇本殺</div>
        <div class="big">${esc(fmtRange(inv.startsAt, inv.endsAt))}</div>
        <div class="muted">${esc(inv.gameTitle || '劇本待店家推薦')}・目前 ${inv.filled}/${inv.capacity} 人</div>
        ${seat ? `<div>主揪幫「<b>${esc(inv.reservedFor)}</b>」保留了一個位子。</div>` : ''}</div>
      <div class="stack">${inv.usable && inv.status === 'recruiting'
        ? `<button id="join">${seat ? `我是${esc(inv.reservedFor)}，認領這個位子` : '加入這團'}</button>`
        : `<div class="card error">${esc(message(inv.status === 'cancelled' ? 'INVITE_INVALID' : seat ? 'INVITE_USED' : 'GROUP_CLOSED'))}</div>`}
        <div id="err" class="error" hidden></div><button class="secondary" id="home">回首頁</button></div>`);
    document.getElementById('home').onclick = () => go('#/');
    const claimBtn = document.getElementById('join');
    if (claimBtn) gated(claimBtn, async () => {
      busy(claimBtn, true);
      try { await api('/invites/claim', { method: 'POST', body: { token } }); go('#/group/' + inv.groupId); }
      catch (x) { if (x.message === 'reauth') return; if (x.code === 'ALREADY_MEMBER') { go('#/group/' + inv.groupId); return; }
        busy(claimBtn, false); if (x.code === 'NOT_FRIEND') return showFriendGate(() => claimBtn.click());
        const el = document.getElementById('err'); el.textContent = message(x.code); el.hidden = false; }
    });
  }

  // ---- Friendship: LINE only delivers notifications to friends of the OA ----------------
  const OA_ADD_FRIEND = 'https://line.me/R/ti/p/@825gdzws';
  // Opening, joining and claiming need friendship (the server enforces it too). The action that
  // was stopped is kept and runs by itself once the player comes back as a friend.
  // true/false from LINE; null when LINE cannot tell (then the server decides).
  async function isFriend() {
    try { return (await liff.getFriendship()).friendFlag; } catch { return null; }
  }
  async function checkFriendship() {
    const friend = await isFriend();
    document.getElementById('friendBar').hidden = friend !== false;
    if (friend !== false && pendingAction) resumeAction();
  }
  let pendingAction = null;
  const gate = document.getElementById('friendGate');
  function showFriendGate(action) {
    pendingAction = action;
    document.getElementById('gateHint').hidden = true;
    gate.hidden = false;
  }
  function resumeAction() {
    const action = pendingAction;
    pendingAction = null; gate.hidden = true;
    action?.();
  }
  function gated(button, action) {
    button.onclick = async () => {
      if (button.disabled) return;
      if (await isFriend() === false) return showFriendGate(() => button.click());
      action();
    };
  }
  const openAddFriend = () => liff.openWindow({ url: OA_ADD_FRIEND, external: false });
  document.getElementById('addFriend').onclick = openAddFriend;
  document.getElementById('gateAdd').onclick = openAddFriend;
  document.getElementById('gateDone').onclick = async () => {
    if (await isFriend() === false) { document.getElementById('gateHint').hidden = false; return; }
    resumeAction();
  };
  document.getElementById('gateClose').onclick = () => { pendingAction = null; gate.hidden = true; };

  // ---- 玩本記錄與點數（店家）: moving the website's Apps Script points into the booking system ----------
  // 1 share the spreadsheet, 2 import, 3 reconcile with the Apps Script's 點數總覽, 4 switch the website over.
  // Until the switch the website keeps using the Apps Script, so importing and checking can be repeated freely.
  const ANOMALY_ZH = { duplicate_player: '「玩家」分頁有重複的名字（以後面那列為準）', duplicate_agent: '探員編號重複',
    ledger_row_without_account: '點數帳本有列沒填「歸戶名」（Apps Script 也不算這些列；要算的話補上歸戶名再匯入）',
    ledger_only_player: '帳本裡有、「玩家」分頁沒有的名字（已建立這位玩家）',
    ledger_name_is_alias: '帳本的「歸戶名」是別人的別名（照試算表當成另一位玩家）',
    duplicate_interaction: '「心得互動」有重複的列', repeated_key: '帳本有重複的去重鍵（照原樣保留）' };
  const FIELD_ZH = { earned: '累積', redeemed: '已兌換', balance: '餘額', plays: '場次', last: '最後遊玩日', agent: '探員編號' };
  function catchUpText(st) {
    const r = st.catchUpResult;
    if (!st.catchUpAt || !r) return '還沒有補匯入過。';
    const when = esc(fmtRange(st.catchUpAt));
    if (r.error) return `⚠️ 上次補匯入（${when}）失敗：${esc(message(r.error))}（${esc(r.error)}）`;
    return `上次補匯入 ${when}：補進 ${r.added} 筆` + (r.failed ? `・⚠️ ${r.failed} 列不合格沒有補進來（例如劇本名稱不在劇本目錄）` : '');
  }
  async function showRecords() {
    render(`<h2>玩本記錄與點數</h2><div class="card">讀取中…</div>`);
    let st;
    try { st = await api('/admin/records'); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>玩本記錄與點數</h2><div class="card error">${esc(message(e.code))}</div>${homeBtn}`); return; }
    // reverted：曾經切換、之後緊急切回 Apps Script。不能再整批匯入（會刪掉切換後的記錄），直接切回來即可。
    const live = st.source === 'supabase', reverted = !live && !!st.wentLiveAt, sum = st.importSummary || {};
    render(`<h2>玩本記錄與點數</h2>
      <p class="muted">把網站「玩本記錄」的點數從 Google Apps Script 搬到預約系統。切換前網站照舊使用 Apps Script，
        匯入、對帳可以重複做，直到完全一致再切換。</p>
      <div class="card stack"><b>目前</b>
        <div>${live ? `✅ 網站已改用預約系統（${esc(fmtRange(st.switchedAt))} 切換）`
          : reverted ? `⚠️ 已緊急切回 Apps Script（${esc(fmtRange(st.switchedAt))}）` : '網站仍使用 Apps Script（試算表）'}</div>
        <div class="muted">${st.importedAt ? `上次匯入 ${esc(fmtRange(st.importedAt))}：玩家 ${st.players}・記錄 ${st.records}・帳本 ${st.ledger} 筆`
          + (sum.anomalies ? `・需要留意 ${sum.anomalies} 項` : '') : '還沒有匯入過。'}${st.webRecords ? `・切換後網站新增 ${st.webRecords} 筆` : ''}</div></div>
      ${live || reverted ? '' : `<div class="card stack"><b>1. 共用試算表</b>
        <div class="muted">打開「玩本記錄」試算表 → 共用 → 加入下面這個服務帳戶，權限選「檢視者」。</div>
        <div style="word-break:break-all"><b>${esc(st.serviceAccountEmail || '（還沒設定 Google 服務帳戶）')}</b></div>
        <a class="link" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/${esc(st.sheetId)}/edit">開啟試算表</a></div>
      <div class="card stack"><b>2. 匯入</b>
        <div class="muted">先在試算表上方選單按「🌟 海星集點 → 重算所有點數」，等它跑完再匯入（手動加在點數帳本的列要重算後，
          Apps Script 的點數總覽才會算進去，否則對帳會有差異）。</div>
        <div class="muted">整批讀入表單回應、點數帳本、玩家、設定、獎勵、任務、心得互動。點數照 Apps Script 已算好的原樣搬，
          每次匯入都會取代上一次的匯入。</div>
        <button id="importBtn">匯入玩本記錄</button><div id="importMsg" class="muted"></div></div>`}
      ${reverted ? '' : `<div class="card stack"><b>${live ? '對帳' : '3. 對帳'}</b>
        <div class="muted">先重新讀一次 Apps Script 的點數總覽，再逐位玩家比對累積、已兌換、餘額、場次、最後遊玩日、探員編號。</div>
        <button class="secondary" id="reconcileBtn">開始對帳</button><div id="reconcileMsg"></div></div>`}
      ${live ? `<div class="card stack"><b>補匯入新記錄</b>
          <div class="muted">網站連不上預約系統時，會改送到 Apps Script。系統每 10 分鐘會自動把這些新記錄補進來（以新規則計點）；
            也可以現在按一次。試算表與服務帳戶的共用請保留到第 4 階段。</div>
          <div class="muted">${catchUpText(st)}</div>
          <button class="secondary" id="importNewBtn">補匯入新記錄</button><div id="importNewMsg" class="muted"></div></div>
        <div class="card stack"><b>緊急切回 Apps Script</b>
          <div class="muted">只在預約系統出問題時使用。切回後，切換期間在這裡新增的記錄、按讚、回歸禮不會出現在試算表裡。</div>
          <button class="secondary" id="backBtn">切回 Apps Script</button><div id="backMsg" class="muted"></div></div>`
      : reverted ? `<div class="card stack"><b>切回預約系統</b>
          <div class="muted">預約系統的問題排除後按這裡（不必再匯入、對帳）。切回期間送到 Apps Script 的玩本記錄，
            切回後會自動補進來（以新規則計點）；這段期間的按讚、以及在試算表手動調整的點數不會帶過來。</div>
          <button id="returnBtn">切回預約系統</button><div id="switchMsg" class="muted"></div></div>`
      : `<div class="card stack"><b>4. 切換</b>
          <div class="muted">對帳一致後才能切換。切換後：網站送出玩本記錄、按讚、榮譽牆與劇本頁的心得都改走預約系統，
            點數在送出當下算好就固定；LINE 會員卡、老玩家綁定的回歸禮也改由預約系統處理。
            切換後兌換審核、補點扣點、精選與隱藏心得、點數規則都在這個店家後台操作，不要再改試算表（試算表的修改不會帶過來）。</div>
          <button id="switchBtn" disabled>切換到預約系統</button><div id="switchMsg" class="muted"></div></div>`}
      ${homeBtn}`);
    const out = (id, html) => { document.getElementById(id).innerHTML = html; };
    const fail = (id, x) => { if (x.message !== 'reauth') out(id, `<div class="error">${esc(message(x.code))}</div>`); };
    document.getElementById('importBtn')?.addEventListener('click', async e => {
      if (!confirm('匯入會取代上一次匯入的資料（網站仍使用 Apps Script，不受影響）。開始匯入？')) return;
      busy(e.target, true);
      try {
        const r = await api('/admin/records/import', { method: 'POST' });
        const kinds = {};
        (r.anomalies || []).forEach(a => { (kinds[a.type] ??= []).push(a.name); });
        out('importMsg', `<div>已匯入：玩家 ${r.players}・記錄 ${r.records}・帳本 ${r.ledger}・心得互動 ${r.interactions}。</div>`
          + Object.entries(kinds).map(([k, names]) => `<div class="muted">⚠️ ${esc(ANOMALY_ZH[k] || k)}：${esc([...new Set(names)].slice(0, 20).join('、'))}${names.length > 20 ? '…' : ''}</div>`).join('')
          + '<div class="muted">接著按「開始對帳」。</div>');
      } catch (x) { fail('importMsg', x); }
      busy(e.target, false);
    });
    document.getElementById('reconcileBtn')?.addEventListener('click', async e => {
      busy(e.target, true);
      try {
        const r = await api('/admin/records/reconcile');
        const stale = r.snapshotFresh ? '' : '<div class="error">⚠️ 這次沒讀到 Apps Script 的最新總覽，是和之前存的副本比對。</div>';
        if (r.matched) {
          out('reconcileMsg', `${stale}<div>✅ 一致：${r.supabasePlayers} 位玩家的點數、場次、探員編號都相同。</div>`
            + (r.snapshotFresh ? '' : '<div class="muted">等讀得到 Apps Script 的最新總覽再對帳一次，才能切換。</div>'));
          const sw = document.getElementById('switchBtn');
          if (sw) sw.disabled = !r.snapshotFresh;
        } else {
          const rows = (r.differences || []).slice(0, 50).map(d => `<div>${esc(d.name)}：${esc(FIELD_ZH[d.field] || d.field)} 試算表 ${esc(d.gas)}／預約系統 ${esc(d.supabase)}</div>`).join('');
          out('reconcileMsg', `${stale}<div class="error">有差異（Apps Script ${r.gasPlayers} 位、預約系統 ${r.supabasePlayers} 位）</div>${rows}`
            + (r.differences?.length > 50 ? `<div class="muted">…還有 ${r.differences.length - 50} 項</div>` : '')
            + (r.onlyGas?.length ? `<div>只在試算表：${esc(r.onlyGas.join('、'))}</div>` : '')
            + (r.onlySupabase?.length ? `<div>只在預約系統：${esc(r.onlySupabase.join('、'))}</div>` : '')
            + (live ? '' : '<div class="muted">先確認試算表已經「重算所有點數」（最常見的原因）；其次是手動列的名字和別名不一致。'
              + '修正試算表、重算後重新匯入、再對帳。確認差異沒問題（例如試算表本身的錯）也可以按下面「仍要切換」。</div>'
              + '<button class="secondary" id="forceBtn">差異已確認，仍要切換</button>'));
          document.getElementById('forceBtn')?.addEventListener('click', ev => doSwitch(ev.target, true));
        }
      } catch (x) { fail('reconcileMsg', x); }
      busy(e.target, false);
    });
    async function doSwitch(btn, force) {
      if (!confirm(force ? '對帳還有差異。確定仍要把網站切換到預約系統嗎？'
        : reverted ? '確定切回預約系統嗎？' : '確定把網站的玩本記錄與點數切換到預約系統嗎？')) return;
      busy(btn, true);
      try { await api('/admin/records/source', { method: 'POST', body: { source: 'supabase', force } }); await showRecords(); }
      catch (x) { busy(btn, false); fail(force ? 'reconcileMsg' : 'switchMsg', x); }
    }
    document.getElementById('switchBtn')?.addEventListener('click', e => doSwitch(e.target, false));
    document.getElementById('returnBtn')?.addEventListener('click', e => doSwitch(e.target, false));
    document.getElementById('importNewBtn')?.addEventListener('click', async e => {
      busy(e.target, true);
      try { const r = await api('/admin/records/import-new', { method: 'POST' });
        out('importNewMsg', `補進 ${r.added} 筆${r.skipped ? `（${r.skipped} 列已匯入或較舊，略過）` : ''}`
          + `${r.failed ? `・⚠️ ${r.failed} 列不合格沒有補進來` : ''}。`); }
      catch (x) { fail('importNewMsg', x); }
      busy(e.target, false);
    });
    document.getElementById('backBtn')?.addEventListener('click', async e => {
      if (!confirm('確定切回 Apps Script？切換期間在預約系統新增的記錄不會出現在試算表，之後也不能再整批匯入；問題排除後請在這頁「切回預約系統」。')) return;
      busy(e.target, true);
      try { await api('/admin/records/source', { method: 'POST', body: { source: 'gas' } }); await showRecords(); }
      catch (x) { busy(e.target, false); fail('backMsg', x); }
    });
  }

  // ---- 第 3 階段（店家）：兌換審核、玩家點數、心得管理、點數規則、月報 --------------------------------
  // 寫入只在切換到預約系統之後（切換前試算表才是正本，這裡改的會被重新匯入蓋掉）；切換前先看得到匯入的資料。
  const liveNote = live => live ? '' : `<div class="card error">網站還在用 Apps Script（試算表）。這裡先看得到匯入的資料，
    但兌換、補點、隱藏、規則修改要在「玩本記錄與點數（搬家）」切換之後才能用。</div>`;
  const storeFail = (id, x) => { if (x.message !== 'reauth') flash(id, message(x.code), true); };
  const recordDate = d => esc(d || '');

  function redemptionCard(r, actions) {
    const title = /稱號/.test(r.reward);
    return `<div class="card stack">
      <div><b>${esc(r.player)}</b>${r.agent ? ` <span class="muted">探員 ${esc(r.agent)}</span>` : ''}
        <span class="tag ${r.status === 'approved' ? 'ok' : ''}">${esc(REDEEM_ZH[r.status] || r.status)}</span></div>
      <div>${esc(r.reward)}・${r.cost} 點</div>
      <div class="muted">${r.fromLine ? `LINE 申請（${esc(r.lineName || 'LINE 玩家')}）` : '店家直接兌換'}・${esc(fmtRange(r.createdAt))}
        ${r.status === 'pending' ? `・餘額 ${r.balance}（申請中共保留 ${r.held}）` : r.decidedAt ? '・處理 ' + esc(fmtRange(r.decidedAt)) : ''}</div>
      ${r.title && !(actions && title) ? `<div>稱號：${esc(r.title)}</div>` : ''}
      ${r.storeNote ? `<div class="muted">備註：${esc(r.storeNote)}</div>` : ''}
      ${actions && r.status === 'pending' ? `${title ? `<input type="text" maxlength="20" value="${esc(r.title)}" placeholder="稱號（可修改）" data-rtitle="${esc(r.id)}">` : ''}
        <input type="text" maxlength="200" placeholder="給玩家的備註（選填，不通過時寫原因）" data-rnote="${esc(r.id)}">
        <div class="chips"><button data-approve="${esc(r.id)}">核准並扣點</button><button class="secondary" data-reject="${esc(r.id)}">不通過</button></div>` : ''}</div>`;
  }

  async function showRedemptions() {
    render(`<h2>兌換審核</h2><div class="card">讀取中…</div>`);
    let d;
    try { d = await api('/admin/redemptions'); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>兌換審核</h2><div class="card error">${esc(message(e.code))}</div>${homeBtn}`); return; }
    render(`<h2>兌換審核</h2>${liveNote(d.live)}
      <p class="muted">玩家在 LINE 會員卡申請的兌換。核准才扣點（榮耀軌的鍍金、稱號、傳奇同時生效），並用 LINE 通知玩家；
        不通過不扣點。沒綁 LINE 的玩家請到「玩家點數」直接兌換。</p>
      <div id="rMsg" class="card" hidden></div>
      <h3>待審核（${d.pending.length}）</h3>${d.pending.length ? d.pending.map(r => redemptionCard(r, true)).join('') : '<div class="card muted">目前沒有待審核的兌換。</div>'}
      ${d.recent.length ? `<h3>最近處理</h3>${d.recent.map(r => redemptionCard(r, false)).join('')}` : ''}
      <div class="stack"><button class="secondary" id="toPlayers">玩家點數</button>${homeBtn}</div>`);
    document.getElementById('toPlayers').onclick = () => go('#/players');
    const decide = (attr, action) => document.querySelectorAll(`[data-${attr}]`).forEach(btn => btn.onclick = async () => {
      const id = btn.dataset[attr], r = d.pending.find(x => x.id === id);
      const title = document.querySelector(`[data-rtitle="${id}"]`)?.value.trim() ?? '';
      const note = document.querySelector(`[data-rnote="${id}"]`).value.trim();
      if (!confirm(action === 'approve' ? `核准 ${r.player} 兌換「${r.reward}」，扣 ${r.cost} 點？` : `不通過 ${r.player} 的「${r.reward}」？點數不會扣。`)) return;
      busy(btn, true);
      try {
        await api(`/admin/redemptions/${id}/${action}`, { method: 'POST', body: { title, note } });
        await showRedemptions();
        flash('rMsg', action === 'approve' ? `已核准並扣 ${r.cost} 點，已通知 ${r.player}。` : `已不通過，已通知 ${r.player}。`);
      } catch (x) { busy(btn, false); storeFail('rMsg', x); }
    });
    decide('approve', 'approve');
    decide('reject', 'reject');
  }

  async function showPlayers() {
    render(`<h2>玩家點數</h2>
      <div class="card stack"><input id="pq" type="text" placeholder="搜尋名字、別名或探員編號" autocomplete="off">
        <div class="muted">不輸入就列出最近有玩的 30 位。</div></div>
      <div id="pList" class="muted">讀取中…</div>${homeBtn}`);
    let seq = 0, timer;
    const load = async () => {
      const mine = ++seq, q = document.getElementById('pq').value.trim();
      try {
        const { players } = await api('/admin/players?q=' + encodeURIComponent(q));
        if (mine !== seq) return;
        const box = document.getElementById('pList');
        box.innerHTML = players.length ? players.map(p => `<button class="card group-row" data-player="${esc(p.name)}">
          <div><b>${esc(p.name)}</b>${p.agent ? ` <span class="muted">探員 ${esc(p.agent)}</span>` : ''}
            <span class="tag ok">${p.balance} 點</span>${p.held ? ` <span class="tag">保留 ${p.held}</span>` : ''}</div>
          <div class="muted">${p.aliases.length ? '別名：' + esc(p.aliases.join('、')) + '・' : ''}${p.last ? '最後填寫 ' + esc(fmtDay(p.last)) : '沒有記錄'}</div></button>`).join('')
          : '<div class="card muted">找不到。</div>';
        box.querySelectorAll('[data-player]').forEach(b => b.onclick = () => go('#/player/' + encodeURIComponent(b.dataset.player)));
      } catch (x) { if (x.message !== 'reauth' && mine === seq) document.getElementById('pList').textContent = message(x.code); }
    };
    document.getElementById('pq').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 300); };
    load();
  }

  const KIND_ZH = { record: '玩本記錄', referred: '被介紹', referrer: '介紹朋友', quest: '任務', like: '心得被讚', featured: '精選心得', bonus: '回歸禮',
    redeem: '兌換', adjust: '補扣點' };
  async function showPlayer(name, note = '') {
    render(`<h2>${esc(name)}</h2><div class="card">讀取中…</div>`);
    let p, cfg;
    try { [p, cfg] = await Promise.all([api('/admin/players?name=' + encodeURIComponent(name)), api('/admin/record-settings')]); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>${esc(name)}</h2><div class="card error">${esc(message(e.code))}</div>
      <div class="stack"><button class="secondary" onclick="location.hash='#/players'">回玩家列表</button>${homeBtn}</div>`); return; }
    const rewards = cfg.rewards.filter(r => r.active);
    const keys = {};
    const key = k => keys[k] ??= crypto.randomUUID();
    render(`<h2>${esc(p.name)}</h2>${liveNote(p.live)}
      <div id="pMsg" class="card" hidden></div>
      <div class="card stack friend-bar">
        <div class="muted">${p.agent ? '探員 ' + esc(p.agent) + '・' : ''}${p.joined ? '加入 ' + esc(p.joined) + '・' : ''}${p.bound ? '已綁 LINE' : '沒有綁 LINE'}</div>
        <div><span style="font-size:36px;font-weight:700;line-height:1.1">${p.balance}</span> 點
          ${p.held ? `<span class="tag">申請中保留 ${p.held}</span>` : ''}</div>
        <div class="muted">累積 ${p.earned}・已兌換 ${p.redeemed}</div>
        <div>${p.gilded ? '<span class="tag ok">鍍金</span> ' : ''}${p.title ? `<span class="tag ok">${esc(p.title)}</span> ` : ''}${p.legend ? '<span class="tag ok">傳奇殿堂</span>' : ''}</div>
        ${p.aliases.length ? `<div class="muted">別名：${esc(p.aliases.join('、'))}</div>` : ''}
        ${p.note ? `<div class="muted">備註：${esc(p.note)}</div>` : ''}</div>

      <div class="card stack"><b>補點／扣點</b>
        <div class="row2"><input id="adjPts" type="number" min="1" max="1000" inputmode="numeric" placeholder="點數">
          <input id="adjWhy" type="text" maxlength="100" placeholder="原因（玩家看得到）"></div>
        <div class="chips"><button id="adjAdd">補點</button><button class="secondary" id="adjSub">扣點</button></div></div>

      <div class="card stack"><b>直接兌換</b>
        <div class="muted">沒綁 LINE 或到店口頭說的玩家用這裡，立即扣點；榮耀軌（鍍金、稱號、傳奇）同時生效。</div>
        <select id="rdReward"><option value="">選擇獎勵</option>${rewards.map(r => `<option value="${esc(r.id)}" ${p.balance - p.held < r.cost ? 'disabled' : ''}>
          ${esc(r.track ? r.track + '・' : '')}${esc(r.name)}（${r.cost} 點）</option>`).join('')}</select>
        <input id="rdTitle" type="text" maxlength="20" placeholder="稱號（兌換稱號時填）">
        <input id="rdNote" type="text" maxlength="200" placeholder="備註（選填）">
        <button id="rdGo">兌換並扣點</button></div>

      <div class="card stack"><b>榮耀軌</b>
        <div class="muted">兌換核准時會自動設定；這裡用來更正。</div>
        <label class="check"><input type="checkbox" id="gGild" ${p.gilded ? 'checked' : ''}> 榮譽牆名字鍍金</label>
        <input id="gTitle" type="text" maxlength="20" value="${esc(p.title)}" placeholder="自訂稱號（空白＝沒有）">
        <label class="check"><input type="checkbox" id="gLegend" ${p.legend ? 'checked' : ''}> 傳奇殿堂</label>
        <button class="secondary" id="gSave">儲存榮耀軌</button></div>

      <div class="card stack"><b>別名</b>
        <div class="muted">玩家填表時用了別的寫法（例如加了表情符號），加成別名，之後的記錄就算到這位。</div>
        ${p.aliases.length ? `<div class="chips wrap">${p.aliases.map(a => `<button class="chip" data-unalias="${esc(a)}">${esc(a)} ✕</button>`).join('')}</div>` : ''}
        <div class="row2"><input id="aNew" type="text" maxlength="60" placeholder="新增別名"><button class="secondary" id="aAdd">加入別名</button></div></div>

      <div class="card stack"><b>合併同一人</b>
        <div class="muted">另一個名字其實也是這位玩家：那個名字的記錄、點數、兌換都移到「${esc(p.name)}」，那個名字變成別名。無法復原。</div>
        <div class="row2"><input id="mFrom" type="text" maxlength="60" placeholder="另一個名字"><button class="danger" id="mGo">合併進來</button></div></div>

      ${p.requests.length ? `<h3>兌換紀錄</h3>${p.requests.map(r => redemptionCard(r, false)).join('')}` : ''}

      <h3>點數帳本（最近 ${p.ledger.length} 筆）</h3>
      <div class="card">${p.ledger.length ? p.ledger.map(l => `<div class="ledger ${l.voided ? 'void' : ''}">
        <div><div>${esc(l.detail || KIND_ZH[l.kind] || l.kind)}</div>
          <div class="muted">${recordDate(l.date)}${l.script ? '・' + esc(l.script) : ''}${l.note ? '・' + esc(l.note) : ''}
            ${l.voided ? `・已作廢${l.voidReason ? '：' + esc(/^hidden:/.test(l.voidReason) ? '記錄已隱藏' : l.voidReason) : ''}` : ''}</div>
          ${l.voided ? '' : `<details><summary class="link">${l.kind === 'redeem' ? '作廢這筆（退還點數）' : '作廢這筆'}</summary><div class="row2" style="margin-top:6px">
            <input type="text" maxlength="200" placeholder="作廢原因" data-vwhy="${esc(l.id)}"><button class="danger" data-void="${esc(l.id)}">確定作廢</button></div></details>`}</div>
        <b>${l.points > 0 ? '+' : ''}${l.points}</b></div>`).join('') : '<div class="muted">沒有點數紀錄。</div>'}</div>

      <h3>玩本記錄（最近 ${p.records.length} 筆）</h3>
      ${p.records.length ? p.records.map(r => `<div class="card stack">
        <div><b>${esc(r.script)}</b> <span class="muted">${recordDate(r.date)}</span>
          ${r.hidden ? '<span class="tag">已隱藏</span>' : `<span class="tag ok">${r.points} 點</span>`}${r.name !== p.name ? ` <span class="muted">（填寫名：${esc(r.name)}）</span>` : ''}</div>
        ${r.comment ? `<div class="muted" style="white-space:pre-wrap">${esc(r.comment)}</div>` : ''}
        ${r.hidden ? `<button class="secondary" data-unhide="${esc(r.id)}">取消隱藏（補回點數）</button>`
          : `<details><summary class="link">隱藏這筆（惡意或重複的記錄）</summary><div class="row2" style="margin-top:6px">
            <input type="text" maxlength="200" placeholder="原因（只有店家看得到）" data-hwhy="${esc(r.id)}"><button class="danger" data-hide="${esc(r.id)}">隱藏並作廢點數</button></div></details>`}
        </div>`).join('') : '<div class="card muted">沒有玩本記錄。</div>'}
      <div class="stack"><button class="secondary" onclick="location.hash='#/players'">回玩家列表</button>${homeBtn}</div>`);
    if (note) flash('pMsg', note);
    const $ = id => document.getElementById(id);
    // Each action reloads this page with a note at the top; on failure the button comes back with the reason.
    const act = async (btn, path, body, done, name2 = p.name) => {
      busy(btn, true);
      try { const r = await api(path, { method: 'POST', body }); await showPlayer(name2, typeof done === 'function' ? done(r) : done); }
      catch (x) { busy(btn, false); storeFail('pMsg', x); }
    };
    const adjust = sign => e => {
      const n = Number($('adjPts').value), why = $('adjWhy').value.trim();
      if (!Number.isInteger(n) || n < 1 || n > 1000) return flash('pMsg', '點數請填 1–1000 的整數。', true);
      if (!why) return flash('pMsg', '請填原因。', true);
      if (!confirm(`${sign > 0 ? '補' : '扣'} ${p.name} ${n} 點（${why}）？`)) return;
      act(e.target, '/admin/players/adjust', { name: p.name, points: sign * n, reason: why, requestId: key('adjust') },
        r => r.duplicate ? '這筆剛才已經記過了，沒有重複記。' : `已${sign > 0 ? '補' : '扣'} ${n} 點，餘額 ${r.balance}。`);
    };
    $('adjAdd').onclick = adjust(1);
    $('adjSub').onclick = adjust(-1);
    $('rdGo').onclick = e => {
      const rw = rewards.find(r => r.id === $('rdReward').value);
      if (!rw) return flash('pMsg', '請選擇獎勵。', true);
      const title = $('rdTitle').value.trim();
      if (/稱號/.test(rw.name) && !title) return flash('pMsg', '兌換稱號請填稱號。', true);
      if (!confirm(`幫 ${p.name} 兌換「${rw.name}」，扣 ${rw.cost} 點？`)) return;
      act(e.target, '/admin/players/redeem', { name: p.name, rewardId: rw.id, title, note: $('rdNote').value.trim(), requestId: key('redeem') },
        `已兌換「${rw.name}」，扣 ${rw.cost} 點。`);
    };
    $('gSave').onclick = e => act(e.target, '/admin/players/glory',
      { name: p.name, gilded: $('gGild').checked, title: $('gTitle').value.trim(), legend: $('gLegend').checked }, '已儲存榮耀軌。');
    $('aAdd').onclick = e => {
      const alias = $('aNew').value.trim();
      if (!alias) return flash('pMsg', '請填別名。', true);
      act(e.target, '/admin/players/alias', { name: p.name, alias }, `已加入別名「${alias}」。`);
    };
    document.querySelectorAll('[data-unalias]').forEach(b => b.onclick = () => {
      if (!confirm(`移除別名「${b.dataset.unalias}」？之後用這個名字填的記錄會變成另一位玩家。`)) return;
      act(b, '/admin/players/alias', { name: p.name, alias: b.dataset.unalias, remove: true }, `已移除別名「${b.dataset.unalias}」。`);
    });
    $('mGo').onclick = e => {
      const from = $('mFrom').value.trim();
      if (!from) return flash('pMsg', '請填要合併進來的名字。', true);
      if (!confirm(`把「${from}」的所有記錄、點數、兌換合併到「${p.name}」？「${from}」會變成別名，無法復原。`)) return;
      act(e.target, '/admin/players/merge', { from, into: p.name }, `已把「${from}」合併進來。`);
    };
    document.querySelectorAll('[data-void]').forEach(b => b.onclick = () => {
      const why = document.querySelector(`[data-vwhy="${b.dataset.void}"]`).value.trim();
      if (!why) return flash('pMsg', '請填作廢原因。', true);
      act(b, `/admin/ledger/${b.dataset.void}/void`, { reason: why }, r => `已作廢，餘額 ${r.balance}。`);
    });
    document.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => {
      if (!confirm('隱藏這筆記錄？心得從榮譽牆與劇本頁消失、不算場次，這筆給的點數一併作廢。之後可以取消隱藏。')) return;
      act(b, `/admin/reviews/${b.dataset.hide}/hide`, { hidden: true, reason: document.querySelector(`[data-hwhy="${b.dataset.hide}"]`).value.trim() },
        r => `已隱藏，作廢 ${r.ledgerRows} 筆點數。`);
    });
    document.querySelectorAll('[data-unhide]').forEach(b => b.onclick = () =>
      act(b, `/admin/reviews/${b.dataset.unhide}/hide`, { hidden: false }, r => `已取消隱藏，補回 ${r.ledgerRows} 筆點數。`));
  }

  // 心得：新的在前，30 筆一頁；可依劇本篩選。精選給作者「精選點數」一次；隱藏＝惡意記錄（點數一併作廢，可取消）。
  async function showReviews(script = '', cursor = null, shown = []) {
    if (!cursor) render(`<h2>心得管理</h2><div class="card">讀取中…</div>`);
    let d;
    try { d = await api(`/admin/reviews?script=${encodeURIComponent(script)}${cursor
      ? `&before=${encodeURIComponent(cursor.submittedAt)}&beforeId=${encodeURIComponent(cursor.id)}` : ''}`); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>心得管理</h2><div class="card error">${esc(message(e.code))}</div>${homeBtn}`); return; }
    const all = [...shown, ...d.reviews];
    const item = r => `<div class="card stack" id="rv-${esc(r.id)}">
      <div><b>${esc(r.name)}</b>${r.player !== r.name ? ` <span class="muted">（${esc(r.player)}）</span>` : ''}
        ${r.featured ? '<span class="tag ok">精選</span>' : ''}${r.hidden ? ' <span class="tag">已隱藏</span>' : ''}</div>
      <div class="muted">${esc(r.script)}・${recordDate(r.date)}${r.role ? '・' + esc(r.role) : ''}${r.rating ? '・' + '★'.repeat(Math.min(5, +r.rating || 0)) : ''}・${r.points} 點${r.likes ? `・${r.likes} 讚` : ''}${r.status === 'backfill' ? '・補登' : ''}</div>
      ${r.comment ? `<div style="white-space:pre-wrap">${esc(r.comment)}</div>` : '<div class="muted">（沒有寫心得）</div>'}
      ${r.hidden && r.hiddenReason ? `<div class="muted">隱藏原因：${esc(r.hiddenReason)}</div>` : ''}
      <div class="chips">${r.hidden ? `<button class="secondary" data-unhide="${esc(r.id)}">取消隱藏</button>`
        : `${r.comment ? `<button class="${r.featured ? 'secondary' : ''}" data-feature="${esc(r.id)}">${r.featured ? '取消精選' : '設為精選'}</button>` : ''}
          <button class="danger" data-hide="${esc(r.id)}">隱藏</button>`}</div></div>`;
    render(`<h2>心得管理</h2>${liveNote(d.live)}
      <div class="card stack"><div class="row2"><input id="rvScript" type="text" value="${esc(script)}" placeholder="劇本名稱（選填）">
        <button class="secondary" id="rvFind">篩選</button></div>
        <div class="muted">精選：給作者精選點數（每則一次），心得在榮譽牆標成精選。隱藏：惡意或重複的記錄，從榮譽牆、劇本頁消失，點數一併作廢，可以取消。</div></div>
      <div id="rvMsg" class="card" hidden></div>
      ${all.length ? all.map(item).join('') : '<div class="card muted">沒有心得。</div>'}
      ${d.reviews.length === 30 ? '<button class="secondary" id="more">看更早的</button>' : ''}${homeBtn}`);
    const next = d.reviews.length ? { submittedAt: d.reviews.at(-1).submittedAt, id: d.reviews.at(-1).id } : cursor;
    document.getElementById('more')?.addEventListener('click', () => showReviews(script, next, all));
    document.getElementById('rvFind').onclick = () => showReviews(document.getElementById('rvScript').value.trim());
    // Update the one card in place, so the store keeps its place in a long list.
    const update = (id, patch, text) => {
      const i = all.findIndex(x => x.id === id);
      Object.assign(all[i], patch);
      document.getElementById('rv-' + id).outerHTML = item(all[i]);
      bind();
      flash('rvMsg', text);
    };
    const bind = () => {
      document.querySelectorAll('[data-feature]').forEach(b => b.onclick = async () => {
        const r = all.find(x => x.id === b.dataset.feature), on = !r.featured;
        busy(b, true);
        try { await api(`/admin/reviews/${r.id}/feature`, { method: 'POST', body: { featured: on } });
          update(r.id, { featured: on }, on ? `已把 ${r.name} 的心得設為精選。` : '已取消精選，精選點數已作廢。'); }
        catch (x) { busy(b, false); storeFail('rvMsg', x); }
      });
      document.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
        const r = all.find(x => x.id === b.dataset.hide);
        if (!confirm(`隱藏 ${r.name} 在「${r.script}」的記錄？會從榮譽牆、劇本頁消失、不算場次，這筆的點數一併作廢。之後可以取消。`)) return;
        busy(b, true);
        try { const x = await api(`/admin/reviews/${r.id}/hide`, { method: 'POST', body: { hidden: true } });
          update(r.id, { hidden: true }, `已隱藏，作廢 ${x.ledgerRows} 筆點數。`); }
        catch (x) { busy(b, false); storeFail('rvMsg', x); }
      });
      document.querySelectorAll('[data-unhide]').forEach(b => b.onclick = async () => {
        const r = all.find(x => x.id === b.dataset.unhide);
        busy(b, true);
        try { const x = await api(`/admin/reviews/${r.id}/hide`, { method: 'POST', body: { hidden: false } });
          update(r.id, { hidden: false, hiddenReason: '' }, `已取消隱藏，補回 ${x.ledgerRows} 筆點數。`); }
        catch (x) { busy(b, false); storeFail('rvMsg', x); }
      });
    };
    bind();
  }

  // 點數規則、獎勵、任務：只影響之後的新點數（已發的點數固定不變）。
  const SETTING_HINT = { 雙倍日: '平日、假日、週三、2026/10/20…，多個用逗號分開；空白＝沒有', 雙倍日文案: '榮譽牆上顯示的說明',
    回歸禮資格日: '這天之前加入的老玩家，綁定 LINE 時發回歸禮', LINE上線日: '', 心得字數門檻: '心得超過幾個字才給心得點數',
    每日上限筆數: '同一人同一天最多幾筆給點', 補登寬限天數: '遊玩日超過幾天才填算補登（不給點）' };
  const QUEST_ZH = { 場次: '每月玩幾場', 心得: '每月寫幾則心得', 新本: '每月玩幾本沒玩過的', 揪團: '每月介紹幾位朋友' };
  async function showRecordSettings(note = '') {
    render(`<h2>點數規則・獎勵・任務</h2><div class="card">讀取中…</div>`);
    let c;
    try { c = await api('/admin/record-settings'); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>點數規則・獎勵・任務</h2><div class="card error">${esc(message(e.code))}</div>${homeBtn}`); return; }
    const rewardRow = (r, i) => `<div class="card stack" data-reward="${i}">
      <div class="row2"><input type="text" maxlength="20" value="${esc(r.track)}" placeholder="分類（如 特權）" data-f="track">
        <input type="number" min="1" max="10000" value="${r.cost ?? ''}" placeholder="所需點數" data-f="cost"></div>
      <input type="text" maxlength="60" value="${esc(r.name)}" placeholder="獎勵名稱（含「鍍金」「稱號」「傳奇」會自動生效）" data-f="name">
      <input type="text" maxlength="200" value="${esc(r.note)}" placeholder="說明（選填）" data-f="note">
      <label class="check"><input type="checkbox" data-f="active" ${r.active !== false ? 'checked' : ''}> 上架</label>
      <button class="secondary" data-save-reward="${i}">${r.id ? '儲存' : '新增獎勵'}</button></div>`;
    const rewards = [...c.rewards, { id: null, track: '', name: '', cost: null, note: '', active: true }];
    const quests = ['場次', '心得', '新本', '揪團'].map(id => c.quests.find(q => q.id === id) ?? { id, label: '', goal: 0, points: 0, active: false });
    render(`<h2>點數規則・獎勵・任務</h2>${liveNote(c.live)}
      <p class="muted">改了只影響之後的新點數，已經發出的點數不會變。</p>
      <div id="sMsg" class="card" hidden></div>
      <h3>點數規則</h3><div class="card">${c.settings.map(x => `<div class="stack" style="padding:8px 0;border-top:1px solid var(--line)">
        <div><b>${esc(x.key)}</b>${SETTING_HINT[x.key] ? `<div class="muted">${esc(SETTING_HINT[x.key])}</div>` : ''}</div>
        <div class="row2"><input type="text" maxlength="200" value="${esc(x.value ?? '')}" data-setting="${esc(x.key)}">
          <button class="secondary" data-save-setting="${esc(x.key)}">儲存</button></div></div>`).join('')}</div>
      <h3>獎勵</h3>${rewards.map(rewardRow).join('')}
      <h3>每月任務</h3>${quests.map(q => `<div class="card stack" data-quest="${esc(q.id)}">
        <div><b>${esc(q.id)}</b> <span class="muted">${esc(QUEST_ZH[q.id])}</span></div>
        <input type="text" maxlength="100" value="${esc(q.label)}" placeholder="說明（{目標} 會換成目標數字）" data-f="label">
        <div class="row2"><input type="number" min="0" max="100" value="${q.goal}" placeholder="目標" data-f="goal">
          <input type="number" min="0" max="1000" value="${q.points}" placeholder="完成給幾點" data-f="points"></div>
        <label class="check"><input type="checkbox" data-f="active" ${q.active ? 'checked' : ''}> 啟用</label>
        <button class="secondary" data-save-quest="${esc(q.id)}">儲存</button></div>`).join('')}
      ${homeBtn}`);
    if (note) flash('sMsg', note);
    const save = async (btn, body, done) => {
      busy(btn, true);
      try { await api('/admin/record-settings', { method: 'POST', body }); await showRecordSettings(done); }
      catch (x) { busy(btn, false); storeFail('sMsg', x); }
    };
    const field = (box, f) => box.querySelector(`[data-f="${f}"]`);
    const int = v => v.trim() === '' ? NaN : Number(v);
    document.querySelectorAll('[data-save-setting]').forEach(b => b.onclick = () => {
      const k = b.dataset.saveSetting;
      save(b, { type: 'setting', key: k, value: document.querySelector(`[data-setting="${k}"]`).value.trim() }, `已儲存「${k}」。`);
    });
    document.querySelectorAll('[data-save-reward]').forEach(b => b.onclick = () => {
      const r = rewards[+b.dataset.saveReward], box = b.closest('[data-reward]');
      save(b, { type: 'reward', id: r.id, track: field(box, 'track').value.trim(), name: field(box, 'name').value.trim(),
        cost: int(field(box, 'cost').value), note: field(box, 'note').value.trim(), active: field(box, 'active').checked },
        r.id ? '已儲存獎勵。' : '已新增獎勵。');
    });
    document.querySelectorAll('[data-save-quest]').forEach(b => b.onclick = () => {
      const box = b.closest('[data-quest]');
      save(b, { type: 'quest', id: b.dataset.saveQuest, label: field(box, 'label').value.trim(), goal: int(field(box, 'goal').value),
        points: int(field(box, 'points').value), active: field(box, 'active').checked }, `已儲存任務「${b.dataset.saveQuest}」。`);
    });
  }

  // 月報（取代試算表的「月報」分頁）：依遊玩日的月份；場次＝同劇本同一天。
  async function showRecordsReport() {
    render(`<h2>玩本月報</h2><div class="card">讀取中…</div>`);
    let months;
    try { ({ months } = await api('/admin/records/report')); }
    catch (e) { if (e.message !== 'reauth') render(`<h2>玩本月報</h2><div class="card error">${esc(message(e.code))}</div>${homeBtn}`); return; }
    render(`<h2>玩本月報</h2>
      <p class="muted">依玩本記錄的遊玩日統計（隱藏的記錄不算）。場次＝同一本同一天；週六日算假日；新玩家＝第一次出現的月份；
        回訪間隔＝同一人和上一場相隔的天數；點數依入帳日期（作廢的不算）。</p>
      ${months.length ? months.map(m => `<div class="card stack"><div class="big">${esc(m.month)}</div>
        <div>${m.sessions} 場・${m.responses} 份記錄${m.sessions ? `（每場 ${m.perSession} 份）` : ''}</div>
        <div class="muted">平日 ${m.weekday}・假日 ${m.weekend}${m.weekdayPct != null ? `（平日 ${m.weekdayPct}%）` : ''}</div>
        <div class="muted">玩家 ${m.active} 位・新玩家 ${m.newPlayers}・介紹 ${m.referrals}${m.avgGap != null ? `・平均 ${m.avgGap} 天回訪` : ''}</div>
        <div class="muted">發出 ${m.earned} 點・兌換 ${m.redeemed} 點</div></div>`).join('') : '<div class="card muted">還沒有資料。</div>'}
      ${homeBtn}`);
  }

  // ---- Router -----------------------------------------------------------------------
  function route() {
    const h = location.hash;
    let m;
    if (h === '#/create') return showCreate();
    if (h === '#/open') return showOpen();
    if (h === '#/history') return showHistory();
    if (h === '#/guide') return showGuide();
    if (h === '#/veteran') return showVeteran();
    if (h === '#/card') return showCard();
    if (h === '#/survey') return showSurvey();
    if (h === '#/admin' && me.isAdmin) return showAdmin();
    if (h === '#/bindings' && me.isAdmin) return showBindings();
    if (h === '#/surveys' && me.isAdmin) return showSurveys();
    if (h === '#/records' && me.isAdmin) return showRecords();
    if (h === '#/redemptions' && me.isAdmin) return showRedemptions();
    if (h === '#/players' && me.isAdmin) return showPlayers();
    if (h === '#/reviews' && me.isAdmin) return showReviews();
    if (h === '#/record-settings' && me.isAdmin) return showRecordSettings();
    if (h === '#/report' && me.isAdmin) return showRecordsReport();
    if ((m = /^#\/player\/(.+)$/.exec(h)) && me.isAdmin) return showPlayer(decodeURIComponent(m[1]));
    if ((m = /^#\/surveys\/(.+)$/.exec(h)) && me.isAdmin) return showSurveyScript(decodeURIComponent(m[1]));
    if ((m = /^#\/group\/([0-9a-f-]{36})$/.exec(h))) return showGroup(m[1]);
    if ((m = /^#\/invite\/([A-Za-z0-9_-]{43})$/.exec(h))) return showInvite(m[1]);
    return showHome();
  }

  async function start() {
    // Check the saved session while LINE initialises instead of after it (each menu tap opens a fresh page).
    const savedToken = store.get(KEY);
    const early = savedToken ? fetch(API_BASE + '/me', { headers: { Authorization: 'Bearer ' + savedToken } })
      .then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null);
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      const entry = location.href;  // before the rewrites below: a login round trip must come back with ?game= etc.
      // Invite links arrive as ?invite=...; move the token into the hash and out of the address bar.
      // Rich Menu, website and notification links: ?view=open|create|history|guide|veteran|card|bindings|surveys|…
      // (bindings, surveys, records, admin, redemptions, players, reviews: store only); none = 首頁（劇本預約＋我的揪團）.
      // ?game=<scripts.js id> preselects a script in the create flow ("預約這本" on the website).
      const params = new URLSearchParams(location.search);
      const view = params.get('view');
      // Links from before 玩本心得 moved back to the website form land on the history page.
      if (params.get('review')) history.replaceState(null, '', location.pathname + '#/history');
      const views = ['open', 'create', 'history', 'guide', 'veteran', 'card', 'survey', 'bindings', 'surveys', 'records', 'admin', 'redemptions', 'players', 'reviews'];
      if (views.includes(view)) history.replaceState(null, '', location.pathname + '#/' + view);
      const gameParam = params.get('game');
      if (view === 'create' && gameParam && /^[A-Za-z0-9_-]{1,64}$/.test(gameParam)) pendingGame = gameParam;
      const invite = new URLSearchParams(location.search).get('invite');
      if (invite && /^[A-Za-z0-9_-]{43}$/.test(invite)) history.replaceState(null, '', location.pathname + '#/invite/' + invite);
      // Notification links arrive as ?group=<id>.
      const group = new URLSearchParams(location.search).get('group');
      if (group && /^[0-9a-f-]{36}$/.test(group)) history.replaceState(null, '', location.pathname + '#/group/' + group);
      me = (await early)?.user ?? null;
      if (!me) store.set(KEY, null);
      if (!me && !(await signIn(entry))) return;
      document.getElementById('who').textContent = me.displayName || '';
      checkFriendship();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkFriendship(); });
      window.addEventListener('hashchange', route);
      route();
    } catch { render('<div class="card error">LINE 初始化失敗，請從 LINE 重新開啟。</div>'); }
  }
  start();
</script>
</body>
